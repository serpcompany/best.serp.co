<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: review console. Screen index rail on the left, the selected screen in a device frame on a quiet stage, review notes under it. */
:root {
  --ui-bg: #eef0f3;
  --ui-panel: #ffffff;
  --ui-fg: #15171c;
  --ui-muted: #5b606e;
  --ui-line: #d9dce3;
  --ui-accent: #2450c8;
  --ui-accent-fg: #ffffff;
  --ui-accent-soft: #e2e8fb;
  --ui-stage: #e3e6eb;
  --ui-chrome: #f6f7f9;
  --ui-chrome-line: #dfe2e8;
  --ui-pill: #ffffff;
  --ui-warn: #8a5a00;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-bg: #0e0f12;
    --ui-panel: #16181d;
    --ui-fg: #ececf0;
    --ui-muted: #9a9fac;
    --ui-line: #2a2d35;
    --ui-accent: #7ea3ff;
    --ui-accent-fg: #0b1020;
    --ui-accent-soft: #1c2440;
    --ui-stage: #090a0c;
    --ui-chrome: #1b1d22;
    --ui-chrome-line: #2b2e36;
    --ui-pill: #23262d;
    --ui-warn: #f0c060;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ui-bg: #0e0f12;
  --ui-panel: #16181d;
  --ui-fg: #ececf0;
  --ui-muted: #9a9fac;
  --ui-line: #2a2d35;
  --ui-accent: #7ea3ff;
  --ui-accent-fg: #0b1020;
  --ui-accent-soft: #1c2440;
  --ui-stage: #090a0c;
  --ui-chrome: #1b1d22;
  --ui-chrome-line: #2b2e36;
  --ui-pill: #23262d;
  --ui-warn: #f0c060;
  color-scheme: dark;
}
html, body { background: var(--ui-bg); color: var(--ui-fg); }
body { font-family: var(--font-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }

/* best.serp.co tokens, copied from packages/design-system/styles/globals.css, scoped to the mockup frame */
.site {
  --background: 0 0% 99%; --foreground: 240 10% 4%;
  --card: 0 0% 100%; --card-foreground: 240 10% 4%;
  --popover: 0 0% 100%; --popover-foreground: 240 10% 4%;
  --primary: 240 6% 10%; --primary-foreground: 0 0% 98%;
  --secondary: 240 5% 96%; --secondary-foreground: 240 6% 10%;
  --muted: 240 5% 96%; --muted-foreground: 240 4% 46%;
  --accent: 240 5% 94%; --accent-foreground: 240 6% 10%;
  --destructive: 0 84% 60%; --destructive-foreground: 0 0% 98%;
  --border: 240 6% 90%; --input: 240 6% 90%; --ring: 240 6% 10%;
  --radius: 0.5rem;
  --sidebar-background: 240 5% 98%; --sidebar-foreground: 240 5% 26%;
  --sidebar-primary: 240 6% 10%; --sidebar-primary-foreground: 0 0% 98%;
  --sidebar-accent: 240 5% 95%; --sidebar-accent-foreground: 240 6% 10%;
  --sidebar-border: 240 6% 90%; --sidebar-ring: 240 6% 10%;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  position: relative;
  overflow: hidden;
}
.site.dark {
  --background: 0 0% 3.9%; --foreground: 0 0% 98%;
  --card: 0 0% 3.9%; --card-foreground: 0 0% 98%;
  --popover: 0 0% 3.9%; --popover-foreground: 0 0% 98%;
  --primary: 0 0% 98%; --primary-foreground: 0 0% 9%;
  --secondary: 0 0% 14.9%; --secondary-foreground: 0 0% 98%;
  --muted: 0 0% 14.9%; --muted-foreground: 0 0% 63.9%;
  --accent: 0 0% 14.9%; --accent-foreground: 0 0% 98%;
  --destructive: 0 72% 50%; --destructive-foreground: 0 0% 98%;
  --border: 0 0% 14.9%; --input: 0 0% 14.9%; --ring: 0 0% 83.1%;
  --sidebar-background: 240 5.9% 10%; --sidebar-foreground: 240 4.8% 95.9%;
  --sidebar-primary: 224.3 76.3% 48%; --sidebar-primary-foreground: 0 0% 100%;
  --sidebar-accent: 240 3.7% 15.9%; --sidebar-accent-foreground: 240 4.8% 95.9%;
  --sidebar-border: 240 3.7% 15.9%; --sidebar-ring: 217.2 91.2% 59.8%;
  color-scheme: dark;
}
.site { container-type: inline-size; }
/* scoped preflight (Tailwind's preflight is off so it cannot touch the review console) */
.site *, .site ::before, .site ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: hsl(var(--border)); }
.site h1, .site h2, .site h3, .site h4, .site h5, .site p, .site ul, .site ol, .site figure, .site blockquote, .site pre, .site dl, .site dd { margin: 0; }
.site h1, .site h2, .site h3, .site h4, .site h5 { font-size: inherit; font-weight: inherit; }
.site ul, .site ol { list-style: none; padding: 0; }
.site button, .site input, .site select, .site textarea { font: inherit; color: inherit; margin: 0; background: transparent; letter-spacing: inherit; }
.site button, .site [role="button"] { cursor: pointer; padding: 0; }
.site a { color: inherit; text-decoration: inherit; }
.site img, .site svg, .site video { display: block; vertical-align: middle; }
.site img { max-width: 100%; height: auto; }
.site table { border-collapse: collapse; text-indent: 0; border-color: inherit; }
.site textarea { resize: vertical; }
.site input::placeholder, .site textarea::placeholder { color: hsl(var(--muted-foreground)); opacity: 1; }
.site hr { height: 0; color: inherit; border-top-width: 1px; margin: 0; }
.site fieldset { margin: 0; padding: 0; min-width: 0; }
.site legend { padding: 0; }
.site summary { list-style-position: inside; }
.site small { font-size: 80%; }
.site b, .site strong { font-weight: 700; }
.site .font-mono, .site code, .site pre, .site kbd { font-family: var(--font-mono); }
.site .grid-bg { background-image: linear-gradient(to right, #8080800a 1px, transparent 1px), linear-gradient(to bottom, #8080800a 1px, transparent 1px); background-size: 32px 32px; }
.site .caret { animation: caret-blink 1.25s ease-out infinite; }
@keyframes caret-blink { 0%, 70%, 100% { opacity: 1 } 20%, 50% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .site .caret, .site .animate-spin, .site .animate-pulse { animation: none !important; } }
.site a { cursor: pointer; }
.site pre.code { background: #0a0a0a; color: #e5e5e5; }

/* ---------- review console ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 10px 20px; background: color-mix(in srgb, var(--ui-panel) 92%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--ui-line);
}
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; margin-right: auto; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { font: 500 12px/1 var(--font-mono); color: var(--ui-muted); white-space: nowrap; }
.ctrls { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.ctrl { display: flex; align-items: center; gap: 8px; }
.ctrl > label, .ctrl > .lbl { font: 600 11px/1 var(--font-ui); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ui-muted); }
.seg { display: inline-flex; border: 1px solid var(--ui-line); border-radius: 8px; padding: 2px; background: var(--ui-bg); }
.seg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; font: 500 13px/1.2 var(--font-ui); color: var(--ui-muted); }
.seg button svg { width: 15px; height: 15px; }
.seg button[aria-pressed="true"] { background: var(--ui-panel); color: var(--ui-fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.seg button:focus-visible, .chipbtn:focus-visible, .rail a:focus-visible, .navbtn:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
.check { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 var(--font-ui); color: var(--ui-muted); cursor: pointer; }
.check input { accent-color: var(--ui-accent); width: 15px; height: 15px; }

.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.rail { border-right: 1px solid var(--ui-line); background: var(--ui-panel); padding: 18px 12px 40px; position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; }
.rail h2 { font: 600 11px/1 var(--font-ui); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ui-muted); margin: 18px 10px 8px; }
.rail h2:first-child { margin-top: 4px; }
.rail a { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 2px 8px; padding: 7px 10px; border-radius: 8px; color: var(--ui-fg); text-decoration: none; }
.rail a:hover { background: var(--ui-bg); }
.rail a[aria-current="true"] { background: var(--ui-accent-soft); }
.rail a[aria-current="true"] .num { background: var(--ui-accent); color: var(--ui-accent-fg); border-color: var(--ui-accent); }
.rail .num { grid-row: span 2; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--ui-line); font: 600 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ui-muted); }
.rail .t { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.rail .r { font: 400 11.5px/1.3 var(--font-mono); color: var(--ui-muted); grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail .cnt { grid-row: 1 / span 2; grid-column: 3; font: 500 11px/1 var(--font-mono); color: var(--ui-muted); }
.rail .new, .eyebrow .new { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 999px; background: var(--ui-accent); color: var(--ui-accent-fg); font: 600 10px/1.2 var(--font-ui); letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 1px; }
.rail .foot { margin: 22px 10px 0; padding-top: 14px; border-top: 1px solid var(--ui-line); font-size: 12px; line-height: 1.5; color: var(--ui-muted); }
.rail .foot kbd { font: 500 11px/1 var(--font-mono); border: 1px solid var(--ui-line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--ui-bg); color: var(--ui-fg); }

.main { min-width: 0; padding: 22px 28px 64px; display: flex; flex-direction: column; gap: 16px; }
.shead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; }
.shead .ttl { min-width: 0; margin-right: auto; }
.eyebrow { font: 600 11px/1 var(--font-ui); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ui-muted); }
.shead h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.shead h1 code { font: 500 0.72em/1 var(--font-mono); color: var(--ui-muted); margin-left: 8px; letter-spacing: 0; }
.navbtns { display: flex; gap: 6px; }
.navbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-panel); font: 500 13px/1.2 var(--font-ui); color: var(--ui-fg); }
.navbtn svg { width: 15px; height: 15px; }
.navbtn[disabled] { opacity: 0.4; cursor: default; }
.mobile-pick { display: none; width: 100%; }
.mobile-pick select { width: 100%; font: 500 14px/1.2 var(--font-ui); padding: 9px 10px; border-radius: 8px; border: 1px solid var(--ui-line); background: var(--ui-panel); color: var(--ui-fg); }

.states { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--ui-line); background: var(--ui-panel); font: 500 13px/1.2 var(--font-ui); color: var(--ui-fg); }
.chipbtn .k { font: 600 11px/1 var(--font-mono); color: var(--ui-muted); }
.chipbtn[aria-pressed="true"] { background: var(--ui-fg); color: var(--ui-bg); border-color: var(--ui-fg); }
.chipbtn[aria-pressed="true"] .k { color: inherit; opacity: 0.7; }
.chipbtn.extra { border-style: dashed; }
.chipbtn.r4 { border-color: var(--ui-warn); }
.chipbtn .r4tag { font: 600 10px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 999px; background: var(--ui-warn); color: var(--ui-panel); }
.rail .new.r4 { background: var(--ui-warn); color: var(--ui-panel); }

.stage { background: var(--ui-stage); border: 1px solid var(--ui-line); border-radius: 14px; padding: 24px; display: flex; justify-content: center; overflow: hidden; }
.device { flex: none; background: var(--ui-chrome); border: 1px solid var(--ui-chrome-line); box-shadow: 0 18px 50px -24px rgb(0 0 0 / 0.35), 0 2px 6px rgb(0 0 0 / 0.06); }
.device.desktop { border-radius: 12px; overflow: hidden; }
.device.mobile { border-radius: 34px; padding: 10px; background: #111214; border-color: #2a2b2f; overflow: hidden; }
.device.mobile .chrome { border-radius: 24px 24px 0 0; }
.device.mobile .viewport { border-radius: 0 0 24px 24px; overflow: hidden; }
.chrome { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--ui-chrome); border-bottom: 1px solid var(--ui-chrome-line); }
.dots { display: flex; gap: 6px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--ui-line); display: block; }
.url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 7px; background: var(--ui-pill); border: 1px solid var(--ui-chrome-line); font: 400 12.5px/1.2 var(--font-mono); color: var(--ui-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.url b { color: var(--ui-fg); font-weight: 500; }
.url svg { width: 12px; height: 12px; flex: none; }
.device.mobile .dots { display: none; }
.device.mobile .chrome { padding: 8px 10px; }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.note { background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.note h3 { margin: 0 0 10px; font: 600 11px/1 var(--font-ui); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ui-muted); }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.5; font-size: 13.5px; }
.note p { margin: 0; line-height: 1.55; font-size: 13.5px; }
.note code { font: 500 12px/1 var(--font-mono); background: var(--ui-bg); border: 1px solid var(--ui-line); border-radius: 4px; padding: 1px 5px; }
.note .q { color: var(--ui-warn); font-weight: 600; }
.note.approve { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.note.approve p { flex: 1 1 320px; }
.note.approve code { font-size: 12.5px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mobile-pick { display: block; }
  .main { padding: 16px 16px 48px; }
  .topbar { padding: 10px 16px; }
  .stage { padding: 12px; border-radius: 10px; }
}
</style>

<script src="https://cdn.tailwindcss.com/3.4.16?plugins=container-queries"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  important: '.site',
  corePlugins: { preflight: false },
  theme: {
    containers: { sm: '640px', md: '768px', lg: '1024px', xl: '1280px' },
    extend: {
      colors: {
        border: 'hsl(var(--border) / <alpha-value>)',
        input: 'hsl(var(--input) / <alpha-value>)',
        ring: 'hsl(var(--ring) / <alpha-value>)',
        background: 'hsl(var(--background) / <alpha-value>)',
        foreground: 'hsl(var(--foreground) / <alpha-value>)',
        primary: { DEFAULT: 'hsl(var(--primary) / <alpha-value>)', foreground: 'hsl(var(--primary-foreground) / <alpha-value>)' },
        secondary: { DEFAULT: 'hsl(var(--secondary) / <alpha-value>)', foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)' },
        destructive: { DEFAULT: 'hsl(var(--destructive) / <alpha-value>)', foreground: 'hsl(var(--destructive-foreground) / <alpha-value>)' },
        muted: { DEFAULT: 'hsl(var(--muted) / <alpha-value>)', foreground: 'hsl(var(--muted-foreground) / <alpha-value>)' },
        accent: { DEFAULT: 'hsl(var(--accent) / <alpha-value>)', foreground: 'hsl(var(--accent-foreground) / <alpha-value>)' },
        card: { DEFAULT: 'hsl(var(--card) / <alpha-value>)', foreground: 'hsl(var(--card-foreground) / <alpha-value>)' },
        popover: { DEFAULT: 'hsl(var(--popover) / <alpha-value>)', foreground: 'hsl(var(--popover-foreground) / <alpha-value>)' },
        sidebar: {
          DEFAULT: 'hsl(var(--sidebar-background) / <alpha-value>)',
          foreground: 'hsl(var(--sidebar-foreground) / <alpha-value>)',
          primary: 'hsl(var(--sidebar-primary) / <alpha-value>)',
          'primary-foreground': 'hsl(var(--sidebar-primary-foreground) / <alpha-value>)',
          accent: 'hsl(var(--sidebar-accent) / <alpha-value>)',
          'accent-foreground': 'hsl(var(--sidebar-accent-foreground) / <alpha-value>)',
          border: 'hsl(var(--sidebar-border) / <alpha-value>)',
          ring: 'hsl(var(--sidebar-ring) / <alpha-value>)'
        }
      },
      boxShadow: { xs: '0 1px 2px 0 rgb(0 0 0 / 0.05)' },
      borderRadius: { xs: '2px', lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)', xl: 'calc(var(--radius) + 4px)' },
      fontFamily: {
        sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace']
      }
    }
  }
}
</script>

const ICONS = {

/* Alert: default and destructive are stock; warning/success are className tones on the
   default variant (shadcn ships no such variants). */
function Alert(tone, title, desc = '', o = {}) {
  const t = {
    default: ['bg-card text-card-foreground', 'info', 'text-muted-foreground'],
    destructive: ['bg-card text-destructive', 'bad', 'text-destructive/90'],
    warning: ['border-amber-500/40 bg-card text-amber-700 dark:text-amber-400', 'warn', 'text-muted-foreground'],
    success: ['border-emerald-500/40 bg-card text-emerald-700 dark:text-emerald-400', 'ok', 'text-muted-foreground'],
    info: ['border-sky-500/40 bg-card text-sky-700 dark:text-sky-400', 'info', 'text-muted-foreground']
  }[tone];
  if (desc && !/^\s*</.test(desc)) desc = `<p>${desc}</p>`;
  return `<div data-slot="alert" role="alert" class="${cx('relative grid w-full grid-cols-[0_1fr] items-start gap-y-0.5 rounded-lg border px-4 py-3 text-sm has-[>svg]:grid-cols-[1rem_1fr] has-[>svg]:gap-x-3 [&>svg]:size-4 [&>svg]:translate-y-0.5 [&>svg]:text-current', t[0], o.cls)}">${icon(o.icon || t[1])}<div data-slot="alert-title" class="col-start-2 line-clamp-1 min-h-4 font-medium tracking-tight">${title}</div>${desc || o.actions ? `<div data-slot="alert-description" class="${cx('col-start-2 grid justify-items-start gap-1 text-sm [&_p]:leading-relaxed [overflow-wrap:anywhere] [&_code]:rounded [&_code]:bg-muted [&_code]:px-1 [&_code]:font-mono [&_code]:text-xs', t[2])}">${desc}${o.actions ? `<div class="mt-2 flex flex-wrap gap-2">${o.actions}</div>` : ''}</div>` : ''}</div>`;
}

  return `<div data-slot="card" class="${cx('flex flex-col gap-6 rounded-xl border bg-card py-6 text-card-foreground shadow-sm', o.cls)}">${header}${o.content != null ? `<div data-slot="card-content" class="${cx('px-6', o.contentCls)}">${o.content}</div>` : ''}${o.footer ? `<div data-slot="card-footer" class="${cx('flex px-6', /items-/.test(o.footerCls || '') ? '' : 'items-center', o.footerCls)}">${o.footer}</div>` : ''}</div>`;

/* Field family (ui.shadcn.com/docs/components/field) */
const FieldGroup = (inner, cls) => `<div data-slot="field-group" class="${cx('flex w-full flex-col gap-7', cls)}">${inner}</div>`;
const FieldLabel = (t, o = {}) => `<label data-slot="field-label" class="${cx('flex w-fit items-center gap-2 text-sm font-medium leading-snug', o.invalid && 'text-destructive')}">${t}${o.opt ? ' <span class="font-normal text-muted-foreground">(optional)</span>' : ''}</label>`;
const FieldDescription = (t, cls) => `<p data-slot="field-description" class="${cx('text-sm font-normal leading-normal text-muted-foreground', cls)}">${t}</p>`;
const FieldError = t => `<div role="alert" data-slot="field-error" class="text-sm font-normal text-destructive">${t}</div>`;
function inputBox(o = {}) {
  const st = o.invalid ? 'border-destructive ring-[3px] ring-destructive/20 dark:ring-destructive/40' : o.focus ? 'border-ring ring-[3px] ring-ring/50' : 'border-input';
  const val = o.value ? `<span class="${cx('truncate', o.mono && 'font-mono text-[13px]')}">${esc(o.value)}</span>${o.focus ? '<span class="caret ml-px h-4 w-px bg-foreground"></span>' : ''}` : `<span class="truncate text-muted-foreground">${esc(o.ph || '')}</span>${o.focus ? '<span class="caret -order-1 mr-px h-4 w-px bg-foreground"></span>' : ''}`;
  if (o.addon) {
    return `<div data-slot="input-group" class="${cx('relative flex h-9 w-full min-w-0 items-center rounded-md border shadow-xs dark:bg-input/30', st, o.disabled && 'opacity-50')}"><div data-slot="input-group-control" class="flex min-w-0 flex-1 items-center px-3 text-sm">${val}</div><div data-slot="input-group-addon" data-align="inline-end" class="flex h-auto shrink-0 items-center gap-2 pr-3 text-sm text-muted-foreground [&>svg]:size-4">${o.addon}</div></div>`;
  }
  return `<div data-slot="input" class="${cx('flex h-9 w-full min-w-0 items-center rounded-md border bg-transparent px-3 py-1 text-sm shadow-xs dark:bg-input/30', st, o.disabled && 'opacity-50')}">${val}</div>`;
}
function textareaBox(o = {}) {
  const st = o.invalid ? 'border-destructive ring-[3px] ring-destructive/20 dark:ring-destructive/40' : 'border-input';
  return `<div data-slot="textarea" class="${cx('flex w-full whitespace-pre-wrap rounded-md border bg-transparent px-3 py-2 text-sm leading-relaxed shadow-xs dark:bg-input/30', o.tall ? 'min-h-36' : 'min-h-16', o.mono && 'font-mono text-xs', st, o.disabled && 'opacity-50')}">${o.value ? esc(o.value) : `<span class="text-muted-foreground">${esc(o.ph || '')}</span>`}</div>`;
}
function selectBox(o = {}) {
  const st = o.invalid ? 'border-destructive ring-[3px] ring-destructive/20 dark:ring-destructive/40' : 'border-input';
  return `<div data-slot="select-trigger" class="${cx('flex h-9 w-full items-center justify-between gap-2 whitespace-nowrap rounded-md border bg-transparent px-3 py-2 text-sm shadow-xs dark:bg-input/30', st, o.cls)}"><span class="${o.value ? '' : 'text-muted-foreground'}">${esc(o.value || o.ph || 'Select…')}</span>${icon('chevD', 'size-4 opacity-50')}</div>`;
}
const Skeleton = cls => `<div data-slot="skeleton" class="${cx('animate-pulse rounded-md bg-primary/10', cls)}"></div>`;

/* A whole Field: label, control, description or error */
function Field(o) {
  const ctrl = o.skeleton ? Skeleton(o.area ? (o.tall ? 'h-36 w-full' : 'h-16 w-full') : 'h-9 w-full')
    : o.area ? textareaBox(o) : o.select ? selectBox({ value: o.value, ph: o.ph || 'Choose a category', invalid: !!o.error }) : inputBox({ ...o, invalid: !!o.error });
  let count = '';
  if (o.max) { const n = (o.value || '').length; count = `<span class="${cx('ml-auto shrink-0 text-xs tabular-nums', n > o.max ? 'font-medium text-destructive' : 'text-muted-foreground')}">${n}/${o.max}</span>`; }
  return `<div data-slot="field" data-invalid="${!!o.error}" class="${cx('flex w-full flex-col gap-3', o.cls)}">
    <div class="flex items-center gap-2">${FieldLabel(o.label, { opt: o.opt, invalid: !!o.error })}${o.tag ? `<span class="ml-auto text-xs text-muted-foreground">${o.tag}</span>` : ''}</div>
    ${ctrl}
    ${o.error || o.desc || count ? `<div class="flex items-start gap-3">${o.error ? FieldError(o.error) : o.desc ? FieldDescription(o.desc) : ''}${count}</div>` : ''}
  </div>`;
}

/* RadioGroup choice card (Field "choice card" pattern) */
function ChoiceCard(title, desc, checked, o = {}) {
  return `<label data-slot="field-label" class="${cx('flex w-full flex-col rounded-md border', checked ? 'border-primary bg-primary/5 dark:bg-primary/10' : 'border-border')}"><div data-slot="field" class="flex w-full items-start gap-3 p-4">

/* InputOTP: 3 + separator + 3 (input-otp docs pattern); slots enlarged via className */
function InputOTP(digits, o = {}) {
  const slot = i => {
    const ch = digits[i] || '';

  };
  return `<div data-slot="input-otp" class="flex items-center gap-2"><div data-slot="input-otp-group" class="flex items-center">${[0, 1, 2].map(slot).join('')}</div><div data-slot="input-otp-separator" role="separator" class="text-muted-foreground">${icon('minus')}</div><div data-slot="input-otp-group" class="flex items-center">${[3, 4, 5].map(slot).join('')}</div></div>`;

const Separator = (vertical, cls) => `<div data-slot="separator" class="${cx('shrink-0 bg-border', vertical ? 'h-4 w-px' : 'h-px w-full', cls)}"></div>`;
function Progress(pct, cls) { return `<div data-slot="progress" class="${cx('relative h-2 w-full overflow-hidden rounded-full bg-primary/20', cls)}"><div data-slot="progress-indicator" class="h-full bg-primary" style="width:${pct}%"></div></div>`; }

function Avatar(initials, o = {}) { return `<span data-slot="avatar" class="${cx('relative flex size-8 shrink-0 overflow-hidden', o.lg ? 'rounded-lg' : 'rounded-full')}"><span data-slot="avatar-fallback" class="${cx('flex size-full items-center justify-center bg-muted text-sm text-muted-foreground', o.lg ? 'rounded-lg' : 'rounded-full')}">${initials}</span></span>`; }
function Breadcrumb(items) {

function Tabs(items, active, o = {}) {

}

}
function Tooltip(text, child) { return `<span class="relative inline-flex">${child}<span data-slot="tooltip-content" class="absolute bottom-full left-1/2 z-50 mb-2 w-fit -translate-x-1/2 whitespace-nowrap rounded-md bg-foreground px-3 py-1.5 text-xs text-background">${text}<span class="absolute left-1/2 top-full size-2.5 -translate-x-1/2 -translate-y-1/2 rotate-45 rounded-[2px] bg-foreground"></span></span></span>`; }
function Empty(o) {

/* Item (ui.shadcn.com/docs/components/item) */

/* DropdownMenu content (static, open) */
function Menu(items, o = {}) {

/* Sonner toast */

/* Data table (dashboard-01 / data-table docs): bordered Table with a muted header */

const RowMenu = () => Button('', { v: 'ghost', size: 'iconSm', icon: 'dotsV', cls: 'text-muted-foreground', sr: 'Open menu' });

function CommandList(ph, items) {

/* Message + Bubble (ui.shadcn.com/docs/components/message, /bubble) */
function Msg(o) {
  const end = o.align === 'end';

const UI = { s: 0, st: 0, vp: 'desktop', th: 'auto', footer: false };
try {
  const saved = JSON.parse(localStorage.getItem('mockups-70') || '{}');
  if (saved.vp === 'desktop' || saved.vp === 'mobile') UI.vp = saved.vp;
  if (['auto', 'light', 'dark'].includes(saved.th)) UI.th = saved.th;
  if (typeof saved.footer === 'boolean') UI.footer = saved.footer;
} catch (e) { /* storage unavailable */ }
const savePrefs = () => { try { localStorage.setItem('mockups-70', JSON.stringify({ vp: UI.vp, th: UI.th, footer: UI.footer })); } catch (e) { /* ignore */ } };
const $ = s => document.querySelector(s);
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';

function siteIsDark() {
  if (UI.th !== 'auto') return UI.th === 'dark';
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function renderRail() {
  const groups = [['Submitter', 'Submitter (public)'], ['Admin', 'Admin'], ['Email', 'Emails']];
  let html = '';
  for (const [g, label] of groups) {
    html += `<h2>${label}</h2>`;
    SCREENS.forEach((S, i) => {
      if (S.group !== g) return;
      html += `<a href="#s${S.n}" data-i="${i}" ${i === UI.s ? 'aria-current="true"' : ''}><span class="num">${S.n}</span><span class="t">${S.title}${S.isNew ? `<span class="new">New r${S.isNew === true ? 2 : S.isNew}</span>` : ''}${S.rev4 ? '<span class="new r4">R4: needs approval</span>' : ''}${S.rev5 ? '<span class="new r4">R5: needs approval</span>' : ''}</span><span class="r">${esc(S.route)}</span><span class="cnt">${S.states.length}</span></a>`;
    });
  }
  html += `<div class="foot">Keys: <kbd>←</kbd> <kbd>→</kbd> states, <kbd>Shift</kbd>+<kbd>←</kbd> <kbd>→</kbd> screens.<br>Copy is draft. Components follow shadcn/ui (packages/design-system). Example products are fictional; categories are real D1 categories.</div>`;
  $('#rail').innerHTML = html;
  $('#screenSelect').innerHTML = SCREENS.map((S, i) => `<option value="${i}" ${i === UI.s ? 'selected' : ''}>${S.n}. ${S.title} (${S.states.length} states)</option>`).join('');
}

function renderNotes(S) {
  const li = a => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
  const shellNote = S.shell ? `<div class="note approve"><p><span class="q">Proposal (Revision 2):</span> signed-in work areas use a dashboard shell instead of the public header and footer: ${S.shell === 'account' ? 'dashboard-01 for /account' : 'sidebar-07 for /admin'}. Approve or reject the shell separately from this screen, e.g. <code>shell: approved</code>.</p></div>` : '';
  $('#notes').innerHTML = `${shellNote}
    <div class="note"><h3>From #59 / #70, reflected here</h3>${li(S.notes.d)}</div>
    <div class="note"><h3>Assumptions and open questions</h3>${li(S.notes.a)}</div>
    <div class="note"><h3>shadcn/ui mapping</h3>${li(S.notes.m)}</div>
    <div class="note"><h3>Custom (no shadcn equivalent)</h3>${li(S.notes.c)}</div>
    <div class="note approve"><p>Approve per screen in a comment on issue #70, for example <code>approved: 1–4, 15; changes: 5 (…)</code>. All visible copy is draft and can change per screen.</p></div>`;
}

function fit() {
  const stage = $('#stage');
  const dev = $('#device');
  const vpEl = dev.querySelector('.viewport');
  const cs = getComputedStyle(stage);
  const avail = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  let design;
  if (UI.vp === 'mobile') { vpEl.style.width = '390px'; design = 390 + 22; }
  else { design = Math.min(Math.max(avail, 1040), 1360); vpEl.style.width = (design - 2) + 'px'; }
  dev.style.width = design + 'px';
  dev.style.zoom = avail < design ? String(Math.max(avail / design, 0.3)) : '1';
}

function render(pushHash = true) {
  const S = SCREENS[UI.s];
  if (UI.st >= S.states.length) UI.st = 0;
  const st = S.states[UI.st];
  $('#sEyebrow').innerHTML = `Screen ${S.n} · ${S.group === 'Email' ? 'Emails' : S.group}${S.shell ? ' · dashboard shell' : ''}${S.isNew ? `<span class="new">New in revision ${S.isNew === true ? 2 : S.isNew}</span>` : ''}`;
  $('#sTitle').innerHTML = `${S.n}. ${S.title}<code>${esc(S.route)}</code>`;
  $('#states').innerHTML = S.states.map((x, i) => `<button type="button" class="chipbtn${x.extra ? ' extra' : ''}${x.rev4 || x.rev5 ? ' r4' : ''}" data-st="${i}" aria-pressed="${i === UI.st}"><span class="k">${LETTERS[i]}</span>${x.label}${x.rev4 ? '<span class="r4tag">R4 new</span>' : ''}${x.rev5 ? '<span class="r4tag">R5 new</span>' : ''}</button>`).join('');
  const isMail = st.url.startsWith('Mail');
  const isExternal = st.url.startsWith('checkout.');
  $('#url').innerHTML = isMail
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${ICONS.mail}</svg><b>${esc(st.url)}</b>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${ICONS.lock}</svg>${isExternal ? `<b>${esc(st.url)}</b>` : `best.serp.co<b>${esc(st.url)}</b>`}`;
  const frame = $('#frame');
  frame.classList.toggle('dark', siteIsDark());
  frame.innerHTML = st.html();
  const dev = $('#device');
  dev.className = `device ${UI.vp}`;
  renderNotes(S);
  document.querySelectorAll('#rail a').forEach(a => a.toggleAttribute('aria-current', Number(a.dataset.i) === UI.s));
  document.querySelectorAll('#rail a[aria-current]').forEach(a => a.setAttribute('aria-current', 'true'));
  $('#screenSelect').value = String(UI.s);
  $('#prevBtn').disabled = UI.s === 0;
  $('#nextBtn').disabled = UI.s === SCREENS.length - 1;
  document.querySelectorAll('#vpSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vp === UI.vp)));
  document.querySelectorAll('#thSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.th === UI.th)));
  $('#footerToggle').checked = UI.footer;
  if (pushHash) { try { history.replaceState(null, '', `#s${S.n}-${st.id}`); } catch (e) { /* ignore */ } }
  fit();
}

function go(s, st = 0) { UI.s = Math.max(0, Math.min(SCREENS.length - 1, s)); UI.st = st; render(); }

function fromHash() {
  const m = /^#s(\d+b?)(?:-([a-z0-9]+))?$/i.exec(location.hash || '');
  if (!m) return false;
  const i = SCREENS.findIndex(S => String(S.n) === m[1].toLowerCase());
  if (i < 0) return false;
  UI.s = i;
  const j = m[2] ? SCREENS[i].states.findIndex(x => x.id === m[2]) : 0;
  UI.st = j < 0 ? 0 : j;
  return true;
}

$('#rail').addEventListener('click', e => { const a = e.target.closest('a[data-i]'); if (!a) return; e.preventDefault(); go(Number(a.dataset.i)); window.scrollTo({ top: 0 }); });
$('#screenSelect').addEventListener('change', e => go(Number(e.target.value)));
$('#states').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (!b) return; UI.st = Number(b.dataset.st); render(); });
$('#prevBtn').addEventListener('click', () => go(UI.s - 1));
$('#nextBtn').addEventListener('click', () => go(UI.s + 1));
$('#vpSeg').addEventListener('click', e => { const b = e.target.closest('[data-vp]'); if (!b) return; UI.vp = b.dataset.vp; savePrefs(); render(false); });
$('#thSeg').addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (!b) return; UI.th = b.dataset.th; savePrefs(); render(false); });
$('#footerToggle').addEventListener('change', e => { UI.footer = e.target.checked; savePrefs(); render(false); });
$('#frame').addEventListener('click', e => { if (e.target.closest('a, button')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const d = e.key === 'ArrowRight' ? 1 : -1;
    if (e.shiftKey) go(UI.s + d);
    else { const n = SCREENS[UI.s].states.length; UI.st = (UI.st + d + n) % n; render(); }
    e.preventDefault();
  }
});
window.addEventListener('hashchange', () => { if (fromHash()) render(false); });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (UI.th === 'auto') render(false); }); } catch (e) { /* ignore */ }
new MutationObserver(() => { if (UI.th === 'auto') $('#frame').classList.toggle('dark', siteIsDark()); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fit)).observe($('#stage'));
else window.addEventListener('resize', fit);

fromHash();
renderRail();
render(false);
</script>
