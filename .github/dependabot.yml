version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Updates land on staging like every other change and reach main by promotion.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Paused during the D1 refactor (serpcompany/best.serp.co#34). After cutover, run one
    # dependency-upgrade pass, then restore a limit and group minor/patch updates.
    open-pull-requests-limit: 0
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
