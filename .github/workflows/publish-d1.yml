name: Publish D1 Catalog

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Reviewed manifest under d1/publications'
        required: true
        type: string
      site_id:
        description: 'Manifest and production D1 tenant'
        required: true
        type: choice
        options:
          - serp.software
          - pornvideodownloaders.com
      confirmation:
        description: 'Type publish-<site>-production to authorize publication'
        required: true
        type: string

concurrency:
  group: ${{ inputs.site_id }}-production-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirmation == format('publish-{0}-production', inputs.site_id)
    environment:
      name: ${{ inputs.site_id == 'pornvideodownloaders.com' && 'pornvideodownloaders-production' || 'production' }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Run publisher contract tests
        run: pnpm test:d1

      - name: Back up production D1
        env: &production_env
          CI: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          WORKER_PRODUCTION_CONFIRM: ${{ inputs.confirmation }}
          D1_PUBLICATION_CONFIRM: ${{ inputs.confirmation }}
          D1_RELEASE_GENERATION: replatform
          DEPLOY_SITE_ID: ${{ inputs.site_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID }}
          CLOUDFLARE_D1_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME }}
          CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID }}
          CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME }}
          CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
        run: pnpm tsx scripts/worker-release.ts backup production --site "${{ inputs.site_id }}"

      - name: Retain pre-publication backup
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_id }}-d1-pre-publication-${{ github.sha }}
          path: .wrangler/backups/${{ inputs.site_id == 'pornvideodownloaders.com' && 'pornvideodownloaders-com' || 'serp-software' }}/production/${{ github.sha }}.replatform.sql
          if-no-files-found: error
          retention-days: 30

      - name: Publish reviewed manifest
        env: *production_env
        run: pnpm d1:publish:production -- "${{ inputs.manifest_path }}"
