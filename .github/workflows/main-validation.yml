name: Main Validation

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  validate:
    name: Full non-deployment harness
    runs-on: ubuntu-latest
    env:
      HARNESS_DIFF_BASE: ${{ github.event.before }}
      HARNESS_DIFF_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/install

      - name: Validate exact pushed revision
        run: pnpm harness:check
