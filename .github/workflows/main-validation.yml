name: Main Validation

# The full harness on every pushed revision of staging (the base branch) and main (production).
on:
  push:
    branches: ['staging', 'main']

permissions:
  contents: read

jobs:
  validate:
    name: Full non-deployment harness
    runs-on: ubuntu-latest
    env:
      # A push that creates the branch has no `before`; its head is a commit that was already
      # validated where it came from, so the changed-file check compares it with itself.
      HARNESS_DIFF_BASE: ${{ github.event.created && github.sha || github.event.before }}
      HARNESS_DIFF_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/install

      - name: Validate exact pushed revision
        run: pnpm harness:check
