name: Main Validation

# The full harness on every pushed revision of staging (the base branch) and main (production).
on:
  push:
    branches: ['staging', 'main']

permissions:
  contents: read

jobs:
  validate:
    name: Full non-deployment harness
    # CI_RUNNER_LABELS picks the runner; fork pull requests stay on ubuntu-latest (docs/HARNESS.md).
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/install

      - name: Validate exact pushed revision
        run: pnpm harness:check
