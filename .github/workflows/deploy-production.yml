name: Deploy Production

# main is production. Every push to main (the owner's fast-forward promotion of staging,
# `pnpm release:promote`) releases it, and a manual dispatch from main re-runs a release with a
# typed confirmation. Only source that Deploy Staging verified on the staging branch is
# released: the same commit (a fast-forward) or the same tree (such as an older promotion merge
# commit). The production environment's required reviewers
# approve every release job. The release records a D1 Time Travel bookmark and migrates
# production D1 only when migrations are pending, and otherwise deploys the Worker only. A
# hotfix-* pull request merged into main stops at the staging check; dispatching with the hotfix
# confirmation replaces that check with proof that main's head is that merge, for a Worker-only
# release. Every release is refused once main has moved on. See docs/deploy-runbook.md and
# docs/release-guards.md.
on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type deploy-best.serp.co-production (or hotfix-best.serp.co-production for an owner-approved hotfix that staging never verified)'
        required: true
        type: string

permissions:
  # Staging verification reads Deploy Staging runs (actions: read) and this commit's tree
  # (contents: read); the hotfix check reads merged pull requests (pull-requests: read).
  actions: read
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Check ref, confirmation & staging verification
    runs-on: ubuntu-latest
    steps:
      - name: Require main and, on a dispatch, the typed confirmation
        id: ref
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys run only from main, not $GITHUB_REF."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRMATION" = "hotfix-best.serp.co-production" ]; then
            message="Hotfix release of $GITHUB_SHA: the staging check is skipped and only the Worker may deploy. Merge main into staging next, with a merge commit (docs/release-guards.md#hotfixes)."
            echo "::warning title=Hotfix release::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "proof=hotfix" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRMATION" != "deploy-best.serp.co-production" ]; then
            echo "::error::Type deploy-best.serp.co-production to deploy production."
            exit 1
          fi
          echo "proof=staging" >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Require a verified staging deploy of this commit's tree
        if: steps.ref.outputs.proof == 'staging'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm tsx scripts/staging-verification.ts

      - name: Require a merged hotfix-* pull request for this commit
        if: steps.ref.outputs.proof == 'hotfix'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm tsx scripts/staging-verification.ts --hotfix

  release:
    name: Validate, bookmark, migrate & deploy production
    needs: [authorize]
    # Job-level, so a run refused by authorize never joins the group and never replaces a
    # valid queued production job. Shared with every production D1 workflow.
    concurrency:
      group: deploy-best-serp-co-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://best.serp.co
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The production environment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/deploy-credentials.md)."
            exit 1
          fi

      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Validate with the fast harness
        run: pnpm harness:fast

      - name: Build OpenNext Worker
        # Sentry (#48): the public DSN and the commit as the release are baked into the build; the
        # auth token only uploads source maps. Unset values leave Sentry off.
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: serpcompany
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: pnpm worker:build

      - name: Plan the release from the production migration ledger
        id: plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A stale release, or a hotfix dispatch with pending migrations, is refused here,
          # before the bookmark and any migration.
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CONFIRM: ${{ inputs.confirmation }}
        run: |
          plan="$(pnpm tsx scripts/cloudflare-release.ts plan-release production)"
          echo "$plan"
          mode="$(jq -r .mode <<<"$plan")"
          case "$mode" in
            database-and-worker | worker-only) ;;
            *)
              echo "::error::plan-release returned no release mode."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release mode: $mode (pending migrations: $(jq -r '.pendingMigrations | join(", ")' <<<"$plan"))" >> "$GITHUB_STEP_SUMMARY"

      - name: Record production D1 Time Travel bookmark
        if: steps.plan.outputs.mode == 'database-and-worker'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Writes the bookmark and its restore command to the run summary, and fails (so nothing
        # below runs) without one. D1 data never leaves Cloudflare: no export, no artifact.
        run: pnpm tsx scripts/cloudflare-release.ts bookmark production

      - name: Apply production D1 migrations
        if: steps.plan.outputs.mode == 'database-and-worker'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CONFIRM: ${{ inputs.confirmation }}
        run: pnpm tsx scripts/cloudflare-release.ts migrate production

      - name: Deploy production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CONFIRM: ${{ inputs.confirmation }}
          # Wrangler records the new version here; the gates wait for it. Outside the checkout,
          # because the release script refuses an unclean tree.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: pnpm tsx scripts/cloudflare-release.ts deploy production

      - name: Run production HTTP gates
        env:
          PRODUCTION_REVIEW_ORIGIN: https://best-serp-co-production.serpcompany.workers.dev
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          server="$(curl -sSI https://best.serp.co | tr -d '\r' | awk -F': ' 'tolower($1) == "server" { print $2 }')"
          if [ "$server" = "GitHub.com" ]; then
            # Pre-cutover: best.serp.co is still GitHub Pages, so gate the production Worker on
            # its noindex workers.dev review origin instead.
            message="best.serp.co is still served by GitHub Pages; gating the production Worker at $PRODUCTION_REVIEW_ORIGIN. Attach the Custom Domain, then rerun (docs/production-cutover.md)."
            echo "::notice title=Pre-cutover HTTP gates::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            pnpm tsx scripts/d1-preview-http-gates.ts staging "$PRODUCTION_REVIEW_ORIGIN"
            exit 0
          fi
          pnpm tsx scripts/d1-preview-http-gates.ts production https://best.serp.co
