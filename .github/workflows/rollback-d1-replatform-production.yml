name: Roll back Production D1 binding
on:
  workflow_dispatch:
    inputs:
      site_id: { required: true, type: choice, options: [serp.software, pornvideodownloaders.com] }
      cutover_run_id: { required: true, type: string }
      cutover_commit_sha: { required: true, type: string }
      receipt_kind: { required: true, type: choice, options: [completed, incomplete-recovery] }
      confirmation: { description: 'Type rollback-<site>-production exactly', required: true, type: string }
concurrency:
  group: ${{ inputs.site_id }}-production-d1
  cancel-in-progress: false
permissions: { actions: read, contents: read }
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == format('rollback-{0}-production', inputs.site_id)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.site_id == 'serp.software' && 'production' || 'pornvideodownloaders-production' }}
    env:
      CI: 'true'
      TRUSTED_PRODUCTION_RECEIPT_SHA256: ${{ secrets.TRUSTED_PRODUCTION_RECEIPT_SHA256 }}
      TRUSTED_RECOVERY_RECEIPT_SHA256: ${{ secrets.TRUSTED_RECOVERY_RECEIPT_SHA256 }}
      CUTOVER_COMMIT_SHA: ${{ inputs.cutover_commit_sha }}
      RECEIPT_KIND: ${{ inputs.receipt_kind }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
      CLOUDFLARE_D1_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_ID }}
      CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: |
          printf '%s\n' "EVIDENCE_DIR=$RUNNER_TEMP/d1-production-rollback" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/d1-production-rollback"
      - name: Download exact immutable cutover receipt
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.receipt_kind == 'completed' && format('{0}-production-cutover-evidence-{1}', inputs.site_id, inputs.cutover_commit_sha) || format('{0}-production-cutover-recovery-{1}', inputs.site_id, inputs.cutover_commit_sha) }}
          path: ${{ runner.temp }}/d1-production-rollback/cutover
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cutover_run_id }}
      - name: Validate receipt and select recorded source version
        run: |
          if [ "$RECEIPT_KIND" = completed ]
          then
            pnpm tsx scripts/d1-replatform-production.ts validate-receipt --site "${{ inputs.site_id }}" --receipt "$EVIDENCE_DIR/cutover/receipt.json" --output "$EVIDENCE_DIR/validated.json"
          else
            test "$RECEIPT_KIND" = incomplete-recovery
            pnpm tsx scripts/d1-replatform-production.ts validate-recovery --site "${{ inputs.site_id }}" --receipt "$EVIDENCE_DIR/cutover/recovery-receipt.json" --output "$EVIDENCE_DIR/validated.json"
          fi
      - name: Roll back only the Worker binding without rebuild or SQL restore
        run: |
          source_version="$(node -e 'const e=require(process.argv[1]).evidence; console.log(process.env.RECEIPT_KIND === "completed" ? e.rollback.sourceVersionId : e.sourceVersionId)' "$EVIDENCE_DIR/validated.json")"
          cutover_id="$(node -e 'console.log(require(process.argv[1]).evidence.cutoverId)' "$EVIDENCE_DIR/validated.json")"
          pnpm tsx scripts/d1-replatform-production.ts assert-locked --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_PRODUCTION_DATABASE_ID" --cutover-id "$cutover_id"
          pnpm tsx scripts/d1-replatform-production.ts assert-locked --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID" --cutover-id "$cutover_id"
          pnpm tsx scripts/d1-replatform-production.ts inspect-version --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_PRODUCTION_DATABASE_ID" --version-id "$source_version" --output "$EVIDENCE_DIR/source-version-preflight.json"
          pnpm exec wrangler versions deploy "${source_version}@100" --name "$CLOUDFLARE_WORKER_PRODUCTION_NAME" --message "protected D1 source binding rollback"
          pnpm tsx scripts/d1-replatform-production.ts observe --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_PRODUCTION_DATABASE_ID" --version-id "$source_version" --output "$EVIDENCE_DIR/rollback.json"
      - uses: actions/upload-artifact@v7
        with: { name: '${{ inputs.site_id }}-production-binding-rollback-${{ github.sha }}', path: '${{ runner.temp }}/d1-production-rollback/', if-no-files-found: error, retention-days: 90 }
