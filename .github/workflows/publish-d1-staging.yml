name: Publish D1 Catalog (staging)

# Applies one reviewed manifest from d1/publications to staging D1, before the same manifest
# reaches production through publish-d1.yml (#95). It first records a D1 Time Travel bookmark in
# the run summary (the restore point); no database export leaves Cloudflare (#97 review B1, #99).
# scripts/d1-remote-publisher.ts re-checks staging, this workflow, the manifest location, the
# typed confirmation, and that the database is staging's.
on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Reviewed manifest under d1/publications (for example d1/publications/2026-10-01-example.yaml)'
        required: true
        type: string
      confirmation:
        description: 'Type publish-best.serp.co-staging to publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: Check ref, manifest, and confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Require staging, a publications manifest, and the typed confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/staging" ]; then
            echo "::error::Staging publication runs only from staging, not $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$MANIFEST_PATH" =~ ^d1/publications/[A-Za-z0-9._-]+\.ya?ml$ ]]; then
            echo "::error::manifest_path must be a YAML file directly under d1/publications/."
            exit 1
          fi
          if [ "$CONFIRMATION" != "publish-best.serp.co-staging" ]; then
            echo "::error::Type publish-best.serp.co-staging to publish."
            exit 1
          fi

  publish:
    name: Bookmark and publish to staging D1
    needs: [authorize]
    # Job-level, so a run refused by authorize never replaces a valid queued staging job.
    concurrency:
      group: deploy-best-serp-co-staging
      cancel-in-progress: false
      # Waits behind a staging deploy rather than replacing or being replaced by one (web.yml).
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The staging environment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/DEPLOY_RUNBOOK.md)."
            exit 1
          fi

      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run publisher contract tests
        run: pnpm test:d1

      - name: Record staging D1 Time Travel bookmark
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm tsx scripts/cloudflare-release.ts bookmark staging

      - name: Publish reviewed manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 8e6b67e5-9c58-4fa9-aca1-25b0020c0833
          D1_PUBLICATION_CONFIRM: ${{ inputs.confirmation }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: pnpm db:publish:staging -- "$MANIFEST_PATH"
