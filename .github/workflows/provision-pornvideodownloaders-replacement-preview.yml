name: Provision PVD replacement Preview D1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type provision-pornvideodownloaders.com-replacement-preview'
        required: true
        type: string

concurrency:
  group: provision-pornvideodownloaders-replacement-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'provision-pornvideodownloaders.com-replacement-preview'
    runs-on: ubuntu-latest
    environment:
      name: pornvideodownloaders-preview
    env:
      CI: 'true'
      D1_PREVIEW_PROVISION_CONFIRM: ${{ inputs.confirmation }}
      D1_PROTECTED_ENVIRONMENT: pornvideodownloaders-preview
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EXPECTED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_EXPECTED_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PREVIEW_DATABASE_ID }}
      CLOUDFLARE_D1_PREVIEW_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_PREVIEW_DATABASE_NAME }}
      CLOUDFLARE_D1_PREVIEW_PLACEMENT: ${{ vars.CLOUDFLARE_D1_PREVIEW_PLACEMENT }}
      CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_ID }}
      CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_NAME }}
      CLOUDFLARE_WORKER_PREVIEW_NAME: ${{ secrets.CLOUDFLARE_WORKER_PREVIEW_NAME }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pinned dependencies
        uses: ./.github/actions/install

      - name: Validate provisioning contracts
        run: |
          pnpm harness:fast
          pnpm exec vitest run scripts/d1-preview-provision.test.ts

      - name: Verify identities and provision only the missing replacement Preview D1
        run: |
          mkdir -p "$RUNNER_TEMP/d1-preview-provision"
          pnpm tsx scripts/d1-preview-provision.ts \
            --site pornvideodownloaders.com \
            --output "$RUNNER_TEMP/d1-preview-provision/result.json"

      - name: Retain non-secret provisioning identity
        uses: actions/upload-artifact@v7
        with:
          name: pornvideodownloaders.com-replacement-preview-d1-${{ github.sha }}
          path: ${{ runner.temp }}/d1-preview-provision/result.json
          if-no-files-found: error
          retention-days: 30
