name: Provision replacement Production D1

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Site whose empty replacement Production D1 will be provisioned'
        required: true
        type: choice
        options:
          - pornvideodownloaders.com
          - serp.software
      confirmation:
        description: 'Type provision-<site>-replacement-production'
        required: true
        type: string

concurrency:
  group: ${{ inputs.site_id }}-production-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == format('provision-{0}-replacement-production', inputs.site_id)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.site_id == 'pornvideodownloaders.com' && 'pornvideodownloaders-production' || 'production' }}
    env:
      CI: 'true'
      D1_PRODUCTION_PROVISION_CONFIRM: ${{ inputs.confirmation }}
      D1_PROTECTED_ENVIRONMENT: ${{ inputs.site_id == 'pornvideodownloaders.com' && 'pornvideodownloaders-production' || 'production' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EXPECTED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_EXPECTED_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_ID }}
      CLOUDFLARE_D1_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_NAME }}
      CLOUDFLARE_D1_PRODUCTION_PLACEMENT: ${{ vars.CLOUDFLARE_D1_PRODUCTION_PLACEMENT }}
      CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID }}
      CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME }}
      CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pinned dependencies
        uses: ./.github/actions/install

      - name: Validate provisioning contracts
        run: |
          pnpm harness:fast
          pnpm exec vitest run scripts/d1-production-provision.test.ts scripts/d1-preview-provision.test.ts

      - name: Verify identities and provision only the missing replacement Production D1
        run: |
          mkdir -p "$RUNNER_TEMP/d1-production-provision"
          pnpm tsx scripts/d1-production-provision.ts \
            --site "${{ inputs.site_id }}" \
            --output "$RUNNER_TEMP/d1-production-provision/result.json"

      - name: Retain non-secret provisioning identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_id }}-replacement-production-d1-${{ github.sha }}
          path: ${{ runner.temp }}/d1-production-provision/result.json
          if-no-files-found: error
          retention-days: 30
