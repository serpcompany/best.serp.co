name: Deploy serp.software

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Protected deployment target'
        required: true
        type: choice
        options:
          - preview
          - production
      confirmation:
        description: 'Type the site- and environment-specific deploy confirmation'
        required: true
        type: string
      release_mode:
        description: 'Deploy only the Worker, or also update the selected D1 database'
        required: true
        default: worker-only
        type: choice
        options:
          - worker-only
          - database-and-worker

concurrency:
  group: ${{ inputs.environment == 'production' && 'serp.software-production-d1' || 'serp.software-preview' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: Validate, update & deploy preview
    if: github.ref == 'refs/heads/main' && inputs.environment == 'preview' && inputs.confirmation == 'deploy-serp.software-preview'
    runs-on: ubuntu-latest
    environment:
      name: serp-software-preview
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Validate repository and Worker contracts
        run: |
          pnpm harness:fast
          pnpm tsx scripts/worker-release.ts validate-replatform preview --site serp.software
          pnpm test:d1
          pnpm typecheck

      - name: Build OpenNext Worker
        run: pnpm worker:build:serpsoftware

      - name: Plan remote migration and verification
        if: inputs.release_mode == 'database-and-worker'
        env:
          D1_REMOTE_CONFIRM: plan-serp.software-preview
          D1_RELEASE_GENERATION: replatform
        run: |
          pnpm tsx scripts/worker-release.ts plan-migration preview --site serp.software
          pnpm tsx scripts/worker-release.ts plan-verify preview --site serp.software

      - name: Verify active Preview identities read-only
        env: &preview_env
          CI: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          D1_RELEASE_GENERATION: replatform
          WORKER_PRODUCTION_CONFIRM: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_ID }}
          CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_NAME }}
          CLOUDFLARE_WORKER_PREVIEW_NAME: ${{ secrets.CLOUDFLARE_WORKER_PREVIEW_NAME }}
        run: pnpm tsx scripts/d1-routine-preview-identity.ts verify --site serp.software

      - name: Back up preview D1
        if: inputs.release_mode == 'database-and-worker'
        env: *preview_env
        run: pnpm tsx scripts/worker-release.ts backup preview --site serp.software

      - name: Retain preview D1 backup
        if: inputs.release_mode == 'database-and-worker'
        uses: actions/upload-artifact@v7
        with:
          name: serp-software-preview-d1-${{ github.sha }}
          path: .wrangler/backups/serp-software/preview/${{ github.sha }}.replatform.sql
          if-no-files-found: error
          retention-days: 14

      - name: Apply migrations, import, and verify preview D1
        if: inputs.release_mode == 'database-and-worker'
        env: *preview_env
        run: |
          pnpm tsx scripts/worker-release.ts migrate preview --site serp.software
          pnpm tsx scripts/worker-release.ts import preview --site serp.software
          pnpm tsx scripts/worker-release.ts verify preview --site serp.software

      - name: Verify schema compatibility and deploy preview Worker
        env: *preview_env
        run: |
          set -euo pipefail
          pnpm tsx scripts/worker-release.ts check-schema preview --site serp.software
          pnpm tsx scripts/worker-release.ts deploy preview --site serp.software

      - name: Prepare Preview smoke evidence
        run: mkdir -p "$RUNNER_TEMP/serp-preview-smoke"

      - name: Install Chromium for protected browser smoke
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run protected Preview route and browser smoke
        env:
          E2E_SITE_ID: serp.software
          E2E_SITE_NAME: SERP Software
          E2E_LISTING_COUNT: '339'
          E2E_LISTING_NAME: 123Movies Video Downloader
          E2E_LISTING_SLUG: 123movies-downloader
          E2E_CATEGORY_SLUG: video-downloaders
          PLAYWRIGHT_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
          PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
        run: |
          set -euo pipefail
          pnpm tsx scripts/d1-preview-http-gates.ts preview serp.software "$PREVIEW_BASE_URL" "$RUNNER_TEMP/serp-preview-smoke/routes.json"
          pnpm --filter e2e exec playwright test tests/multisite-smoke.spec.ts --project=chromium

      - name: Retain Preview smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serp-software-preview-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/serp-preview-smoke/
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

  production:
    name: Validate, update & deploy production
    if: github.ref == 'refs/heads/main' && inputs.environment == 'production' && inputs.confirmation == 'deploy-serp.software-production'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Validate repository and Worker contracts
        run: |
          pnpm harness:check
          pnpm tsx scripts/worker-release.ts validate-replatform production --site serp.software

      - name: Build OpenNext Worker
        run: pnpm worker:build:serpsoftware

      - name: Plan remote migration and verification
        if: inputs.release_mode == 'database-and-worker'
        env:
          D1_REMOTE_CONFIRM: plan-serp.software-production
          D1_RELEASE_GENERATION: replatform
        run: |
          pnpm tsx scripts/worker-release.ts plan-migration production --site serp.software
          pnpm tsx scripts/worker-release.ts plan-verify production --site serp.software

      - name: Back up production D1
        if: inputs.release_mode == 'database-and-worker'
        env: &production_env
          CI: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          D1_RELEASE_GENERATION: replatform
          WORKER_PRODUCTION_CONFIRM: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID }}
          CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME }}
          CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
        run: pnpm tsx scripts/worker-release.ts backup production --site serp.software

      - name: Retain production D1 backup
        if: inputs.release_mode == 'database-and-worker'
        uses: actions/upload-artifact@v7
        with:
          name: serp-software-production-d1-${{ github.sha }}
          path: .wrangler/backups/serp-software/production/${{ github.sha }}.replatform.sql
          if-no-files-found: error
          retention-days: 30

      - name: Apply production D1 migrations
        if: inputs.release_mode == 'database-and-worker'
        env: *production_env
        run: pnpm tsx scripts/worker-release.ts migrate production --site serp.software

      - name: Verify schema compatibility and deploy production Worker
        env: *production_env
        run: |
          set -euo pipefail
          pnpm tsx scripts/worker-release.ts check-schema production --site serp.software
          pnpm tsx scripts/worker-release.ts deploy production --site serp.software
