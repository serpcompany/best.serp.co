name: Label PRs

on:
  - pull_request_target

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # CI_RUNNER_LABELS picks the runner; fork pull requests stay on ubuntu-latest (docs/ci.md#runners).
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}

    steps:
      - name: Ensure managed labels exist
        uses: actions/github-script@v9
        with:
          script: |
            const labelDefinitions = [
              {
                name: 'area:content',
                color: '0E8A16',
                description: 'Touches D1 catalog migrations, verified submissions, or publication manifests.'
              }
            ]

            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })

            const existingByName = new Map(
              existingLabels.map(label => [label.name, label])
            )

            for (const definition of labelDefinitions) {
              const existing = existingByName.get(definition.name)

              if (!existing) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...definition
                })
                continue
              }

              if (
                existing.color.toLowerCase() !== definition.color.toLowerCase() ||
                (existing.description ?? '') !== definition.description
              ) {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: definition.name,
                  new_name: definition.name,
                  color: definition.color,
                  description: definition.description
                })
              }
            }

      # The labeler prefers a local .github/labeler.yml, and a persistent runner's workspace keeps
      # the previous job's checkout. Check out only the rules, from the base commit that
      # pull_request_target runs (never the pull request's head), and run none of it.
      - name: Check out the base labeler rules
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/labeler.yml
          sparse-checkout-cone-mode: false

      - uses: actions/labeler@v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
