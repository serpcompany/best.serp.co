name: Harness Gardening

on:
  workflow_dispatch:
  schedule:
    - cron: '23 16 * * 3'

permissions:
  contents: read

concurrency:
  group: harness-gardening
  cancel-in-progress: true

jobs:
  deterministic-audit:
    name: Documentation and architecture health
    # CI_RUNNER_LABELS picks the runner; fork pull requests stay on ubuntu-latest (docs/CI.md#runners).
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/install

      - name: Audit documentation and D1 architecture
        run: pnpm docs:garden

      - name: Exercise migration and worktree harness contracts
        run: pnpm exec vitest run scripts/migration-preflight.test.ts scripts/worktree-harness.test.ts

      - name: Run fast feedback loop
        run: pnpm harness:fast
