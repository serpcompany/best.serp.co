name: Production Dependency Audit

on:
  pull_request:
    branches: ['staging', 'main']
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: High and critical production advisories
    # CI_RUNNER_LABELS picks the runner; fork pull requests stay on ubuntu-latest (docs/ci.md#runners).
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Compare production advisories with the reviewed baseline
        run: pnpm security:audit:production
