name: Upload Listing Media

# Uploads one reviewed listing media plan from d1/media into the production media bucket (#95). Every
# object is fetched again from its recorded source and uploaded only when its bytes still match
# the plan; objects the media host already serves are skipped. scripts/media-upload.ts re-checks
# main, this workflow, the plan location, and the typed confirmation, and refuses any key
# outside best.serp.co/listings/.
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Reviewed media plan under d1/media (for example d1/media/2026-10-06-legacy-media.json)'
        required: true
        type: string
      confirmation:
        description: 'Type upload-media-best.serp.co-production to upload'
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: Check ref, plan, and confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Require main, a media plan, and the typed confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This media upload runs only from main, not $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$PLAN_PATH" =~ ^d1/media/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "::error::plan_path must be a JSON file directly under d1/media/."
            exit 1
          fi
          if [ "$CONFIRMATION" != "upload-media-best.serp.co-production" ]; then
            echo "::error::Type upload-media-best.serp.co-production to upload."
            exit 1
          fi

  upload:
    name: Upload to the production media bucket
    needs: [authorize]
    # Job-level, so a run refused by authorize never replaces a valid queued production job.
    concurrency:
      group: deploy-best-serp-co-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The production environment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/DEPLOY_RUNBOOK.md)."
            exit 1
          fi

      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Upload the reviewed media plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEDIA_UPLOAD_CONFIRM: ${{ inputs.confirmation }}
          PLAN_PATH: ${{ inputs.plan_path }}
        run: pnpm media:upload:production -- "$PLAN_PATH"
