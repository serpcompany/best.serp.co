name: Finalize Production D1 cutover
on:
  workflow_dispatch:
    inputs:
      site_id: { required: true, type: choice, options: [serp.software, pornvideodownloaders.com] }
      cutover_run_id: { required: true, type: string }
      cutover_commit_sha: { required: true, type: string }
      confirmation: { description: 'Type finalize-<site>-production exactly', required: true, type: string }
concurrency:
  group: ${{ inputs.site_id }}-production-d1
  cancel-in-progress: false
permissions: { actions: read, contents: read }
jobs:
  finalize:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == format('finalize-{0}-production', inputs.site_id)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.site_id == 'serp.software' && 'production' || 'pornvideodownloaders-production' }}
    env:
      TRUSTED_PRODUCTION_RECEIPT_SHA256: ${{ secrets.TRUSTED_PRODUCTION_RECEIPT_SHA256 }}
      CUTOVER_COMMIT_SHA: ${{ inputs.cutover_commit_sha }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
      CLOUDFLARE_D1_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_ID }}
      CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: |
          printf '%s\n' "EVIDENCE_DIR=$RUNNER_TEMP/d1-production-finalize" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/d1-production-finalize"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.site_id }}-production-cutover-evidence-${{ inputs.cutover_commit_sha }}
          path: ${{ runner.temp }}/d1-production-finalize/cutover
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cutover_run_id }}
      - name: Validate stabilization receipt and exact active target
        run: |
          pnpm tsx scripts/d1-replatform-production.ts validate-receipt --site "${{ inputs.site_id }}" --receipt "$EVIDENCE_DIR/cutover/receipt.json" --output "$EVIDENCE_DIR/validated.json"
          target_version="$(node -e 'console.log(require(process.argv[1]).evidence.rollback.targetVersionId)' "$EVIDENCE_DIR/validated.json")"
          pnpm tsx scripts/d1-replatform-production.ts observe --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID" --version-id "$target_version" --output "$EVIDENCE_DIR/active-target.json"
          pnpm tsx scripts/d1-preview-http-gates.ts production "${{ inputs.site_id }}" "$PRODUCTION_BASE_URL" "$EVIDENCE_DIR/catalog-gates.json"
      - name: Unfreeze only the confirmed active replacement database
        run: |
          cutover_id="$(node -e 'console.log(require(process.argv[1]).evidence.cutoverId)' "$EVIDENCE_DIR/validated.json")"
          pnpm tsx scripts/d1-replatform-production.ts assert-locked --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_PRODUCTION_DATABASE_ID" --cutover-id "$cutover_id"
          pnpm tsx scripts/d1-replatform-production.ts assert-locked --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID" --cutover-id "$cutover_id"
          pnpm tsx scripts/d1-replatform-production.ts finalize --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID" --cutover-id "$cutover_id"
          pnpm tsx scripts/d1-replatform-production.ts assert-locked --site "${{ inputs.site_id }}" --database-id "$CLOUDFLARE_D1_PRODUCTION_DATABASE_ID" --cutover-id "$cutover_id"
      - uses: actions/upload-artifact@v7
        with: { name: '${{ inputs.site_id }}-production-cutover-finalization-${{ github.sha }}', path: '${{ runner.temp }}/d1-production-finalize/', if-no-files-found: error, retention-days: 90 }
