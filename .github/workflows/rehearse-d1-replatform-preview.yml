name: Rehearse protected D1 replatform Preview

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Explicit Site Preview target'
        required: true
        type: choice
        options:
          - serp.software
          - pornvideodownloaders.com
      confirmation:
        description: 'Type rehearse-<site>-preview'
        required: true
        type: string

concurrency:
  group: d1-replatform-preview-${{ inputs.site_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rehearse:
    name: Rehearse ${{ inputs.site_id }} replacement Preview
    if: github.ref == 'refs/heads/main' && inputs.confirmation == format('rehearse-{0}-preview', inputs.site_id)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.site_id == 'serp.software' && 'serp-software-preview' || 'pornvideodownloaders-preview' }}
    env:
      CI: 'true'
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      WORKER_PRODUCTION_CONFIRM: ${{ inputs.confirmation }}
      D1_RELEASE_GENERATION: replatform
      D1_PREVIEW_DATA_POLICY: ${{ inputs.site_id == 'pornvideodownloaders.com' && 'sanitized-snapshot' || 'controlled-fixtures' }}
      D1_PROTECTED_ENVIRONMENT: ${{ inputs.site_id == 'serp.software' && 'serp-software-preview' || 'pornvideodownloaders-preview' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EXPECTED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_EXPECTED_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PREVIEW_DATABASE_ID }}
      CLOUDFLARE_D1_PREVIEW_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_PREVIEW_DATABASE_NAME }}
      CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_ID }}
      CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PREVIEW_DATABASE_NAME }}
      CLOUDFLARE_WORKER_PREVIEW_NAME: ${{ secrets.CLOUDFLARE_WORKER_PREVIEW_NAME }}
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      REPLATFORM_PREVIEW_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pinned dependencies
        uses: ./.github/actions/install

      - name: Validate contracts and fresh replacement template
        run: |
          pnpm harness:fast
          pnpm tsx scripts/worker-release.ts validate-replatform preview --site "${{ inputs.site_id }}"
          pnpm d1:replatform:config:validate

      - name: Build exact-commit Worker
        run: pnpm --filter "${{ inputs.site_id }}" build:worker

      - name: Prepare external evidence directory
        run: |
          echo "REPLATFORM_EVIDENCE_DIR=$RUNNER_TEMP/d1-replatform-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/d1-replatform-evidence"

      - name: Read-only preflight account, D1, and optional Worker identity
        run: pnpm tsx scripts/d1-replatform-cutover.ts preflight-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-worker-preflight.json"

      - name: Deploy and observe exact credential-free source-bound Worker
        env:
          D1_RELEASE_GENERATION: legacy
        run: |
          set -euo pipefail
          worker_state="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).workerState)' "$REPLATFORM_EVIDENCE_DIR/preview-worker-preflight.json")"
          test "$worker_state" = 'missing-allowed' -o "$worker_state" = 'existing-exact'
          pnpm tsx scripts/d1-replatform-cutover.ts preflight-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-worker-preflight-before-source-deploy.json"
          pnpm tsx scripts/worker-release.ts deploy preview --site "${{ inputs.site_id }}" 2>&1 | tee "$REPLATFORM_EVIDENCE_DIR/preview-source-worker-deploy.log"
          REPLATFORM_SOURCE_DEPLOY_VERSION_ID="$(node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, "");
            const ids = [...source.matchAll(/Current Version ID:\s*([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/g)].map(match => match[1]);
            if (ids.length !== 1) throw new Error("Source-bound deploy did not emit exactly one Worker Version ID.");
            process.stdout.write(ids[0]);
          ' "$REPLATFORM_EVIDENCE_DIR/preview-source-worker-deploy.log")"
          export REPLATFORM_SOURCE_DEPLOY_VERSION_ID
          if ! pnpm tsx scripts/d1-replatform-cutover.ts observe-preview-deployment --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-source-worker-deployment.json"
          then
            touch "$REPLATFORM_EVIDENCE_DIR/PREEXISTING_AUTHORITY_RECOVERY_REQUIRED"
            printf '%s\n' 'Reviewed source-bound Worker was not credential-free; no secret or database mutation was attempted. Remove preserved rehearsal authority manually, then rerun.' > "$REPLATFORM_EVIDENCE_DIR/MANUAL_RECOVERY_REQUIRED.txt"
            exit 1
          fi
          cp "$REPLATFORM_EVIDENCE_DIR/preview-source-worker-deployment.json" "$REPLATFORM_EVIDENCE_DIR/preview-identity.json"

      - name: Install transient Preview rehearsal secrets
        run: |
          set -euo pipefail
          signing_secret="$(openssl rand -hex 32)"
          binding_nonce="$(openssl rand -hex 32)"
          intake_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_secret"
          echo "::add-mask::$binding_nonce"
          echo "::add-mask::$intake_secret"
          export signing_secret binding_nonce intake_secret
          {
            echo "REPLATFORM_PREVIEW_SIGNING_SECRET=$signing_secret"
            echo "REPLATFORM_PREVIEW_BINDING_NONCE=$binding_nonce"
            echo "REPLATFORM_PREVIEW_INTAKE_SECRET=$intake_secret"
          } >> "$GITHUB_ENV"
          pre_secret="$REPLATFORM_EVIDENCE_DIR/preview-source-worker-deployment.json"
          REPLATFORM_PRE_SECRET_DEPLOYMENT_ID="$(node -e 'const value=require(process.argv[1]); process.stdout.write(value.activeDeployment.deploymentId)' "$pre_secret")"
          REPLATFORM_PRE_SECRET_VERSION_ID="$(node -e 'const value=require(process.argv[1]); process.stdout.write(value.activeDeployment.versionId)' "$pre_secret")"
          REPLATFORM_PRE_SECRET_SCRIPT_ETAG="$(node -e 'const value=require(process.argv[1]); process.stdout.write(value.activeDeployment.scriptEtag)' "$pre_secret")"
          export REPLATFORM_PRE_SECRET_DEPLOYMENT_ID REPLATFORM_PRE_SECRET_VERSION_ID REPLATFORM_PRE_SECRET_SCRIPT_ETAG
          secret_file="$RUNNER_TEMP/replatform-preview-secrets.json"
          install -m 600 /dev/null "$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              REPLATFORM_PREVIEW_SIGNING_SECRET: process.env.signing_secret,
              REPLATFORM_PREVIEW_BINDING_NONCE: process.env.binding_nonce,
              REPLATFORM_PREVIEW_INTAKE_SECRET: process.env.intake_secret,
              REPLATFORM_PREVIEW_RUN_ID: process.env.REPLATFORM_PREVIEW_RUN_ID,
              REPLATFORM_PREVIEW_COMMIT_SHA: process.env.GITHUB_SHA,
              REPLATFORM_PREVIEW_WORKER_NAME: process.env.CLOUDFLARE_WORKER_PREVIEW_NAME
            }));
          ' "$secret_file"
          touch "$REPLATFORM_EVIDENCE_DIR/transient-authority-install-attempted"
          pnpm exec wrangler secret bulk "$secret_file" --name "$CLOUDFLARE_WORKER_PREVIEW_NAME" 2>&1 | tee "$REPLATFORM_EVIDENCE_DIR/preview-secret-bulk.log"
          rm -f "$secret_file"
          trap - EXIT
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, "");
            const required = ["REPLATFORM_PREVIEW_SIGNING_SECRET", "REPLATFORM_PREVIEW_BINDING_NONCE", "REPLATFORM_PREVIEW_INTAKE_SECRET", "REPLATFORM_PREVIEW_RUN_ID", "REPLATFORM_PREVIEW_COMMIT_SHA", "REPLATFORM_PREVIEW_WORKER_NAME"];
            for (const name of required) if ((source.match(new RegExp(`Successfully created secret for key: ${name}`, "g")) ?? []).length !== 1) throw new Error(`Bulk secret output is incomplete or ambiguous for ${name}.`);
            if (!source.includes("6 secrets successfully created")) throw new Error("Bulk secret summary is incomplete.");
          ' "$REPLATFORM_EVIDENCE_DIR/preview-secret-bulk.log"
          pnpm tsx scripts/d1-replatform-cutover.ts observe-preview-secret-deployment --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-secret-worker-deployment.json"
          pnpm exec wrangler secret list --name "$CLOUDFLARE_WORKER_PREVIEW_NAME" --format json > "$RUNNER_TEMP/replatform-secret-names.json"
          node -e '
            const fs = require("node:fs");
            const names = new Set(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).map(item => item.name));
            const required = ["REPLATFORM_PREVIEW_SIGNING_SECRET", "REPLATFORM_PREVIEW_BINDING_NONCE", "REPLATFORM_PREVIEW_INTAKE_SECRET", "REPLATFORM_PREVIEW_RUN_ID", "REPLATFORM_PREVIEW_COMMIT_SHA", "REPLATFORM_PREVIEW_WORKER_NAME"];
            if (required.some(name => !names.has(name))) throw new Error("Transient Preview Worker secrets are incomplete.");
          ' "$RUNNER_TEMP/replatform-secret-names.json"

      - name: Measure empty target or trusted prior receipt
        run: pnpm tsx scripts/d1-preview-measure.ts preflight "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/preview-preflight.json"

      - name: Re-observe identities before backup mutation group
        run: pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-backup.json"

      - name: Retain pre-bootstrap source Preview backup
        env:
          D1_RELEASE_GENERATION: legacy
        run: |
          pnpm tsx scripts/worker-release.ts backup preview --site "${{ inputs.site_id }}"
          source_backup="$(find .wrangler/backups -path "*/preview/$GITHUB_SHA.sql" -print -quit)"
          test -n "$source_backup"
          cp "$source_backup" "$REPLATFORM_EVIDENCE_DIR/source-pre-bootstrap.sql"

      - name: Upload PVD source recovery backup before sanitization
        if: inputs.site_id == 'pornvideodownloaders.com'
        uses: actions/upload-artifact@v7
        with:
          name: pornvideodownloaders.com-preview-pre-sanitization-backup-${{ github.sha }}
          path: ${{ runner.temp }}/d1-replatform-evidence/source-pre-bootstrap.sql
          if-no-files-found: error
          retention-days: 30

      - name: Re-observe PVD identity before bounded sanitization
        if: inputs.site_id == 'pornvideodownloaders.com'
        run: pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/pvd-sanitization-identity.json"

      - name: Sanitize exact known PVD Preview private graph
        if: inputs.site_id == 'pornvideodownloaders.com'
        run: |
          set -euo pipefail
          source_backup="$(find .wrangler/backups -path "*/preview/$GITHUB_SHA.sql" -print -quit)"
          test -n "$source_backup"
          pnpm tsx scripts/d1-preview-sanitize.ts \
            --identity "$REPLATFORM_EVIDENCE_DIR/pvd-sanitization-identity.json" \
            --backup "$source_backup" \
            --journal "$REPLATFORM_EVIDENCE_DIR/pvd-sanitization-journal.json" \
            --output "$REPLATFORM_EVIDENCE_DIR/pvd-sanitization-result.json"

      - name: Retain empty replacement Preview backup
        run: pnpm tsx scripts/worker-release.ts backup preview --site "${{ inputs.site_id }}"

      - name: Re-observe identities before controlled legacy source initialization
        run: pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-source-bootstrap.json"

      - name: Initialize or verify controlled legacy Preview source
        env:
          D1_RELEASE_GENERATION: legacy
        run: |
          set -euo pipefail
          pnpm tsx scripts/d1-preview-source-classify.ts "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/source-classification.json"
          source_class="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).classification)' "$REPLATFORM_EVIDENCE_DIR/source-classification.json")"
          if [ "$source_class" = 'controlled-populated' ]
          then
            pnpm tsx scripts/worker-release.ts verify preview --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/source-existing-parity.json"
            pnpm tsx scripts/worker-release.ts check-schema preview --site "${{ inputs.site_id }}"
            pnpm tsx scripts/worker-release.ts import preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/source-first-import.txt"
            grep -F "import is a no-op" "$REPLATFORM_EVIDENCE_DIR/source-first-import.txt"
          else
            test "$source_class" = 'blank'
            pnpm tsx scripts/worker-release.ts migrate preview --site "${{ inputs.site_id }}"
            pnpm tsx scripts/worker-release.ts import preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/source-first-import.txt"
          fi
          pnpm tsx scripts/worker-release.ts verify preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/source-first-parity.json"
          pnpm tsx scripts/worker-release.ts check-schema preview --site "${{ inputs.site_id }}"
          pnpm tsx scripts/worker-release.ts import preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/source-repeat-import.txt"
          grep -F "import is a no-op" "$REPLATFORM_EVIDENCE_DIR/source-repeat-import.txt"
          pnpm tsx scripts/worker-release.ts verify preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/source-repeat-parity.json"
          cmp "$REPLATFORM_EVIDENCE_DIR/source-first-parity.json" "$REPLATFORM_EVIDENCE_DIR/source-repeat-parity.json"
          pnpm tsx scripts/d1-preview-measure.ts source "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/source-controlled.json"
          pnpm tsx scripts/d1-preview-source-classify.ts "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/source-final-classification.json"

      - name: Re-observe identities before populated source rollback backup
        run: pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-populated-source-backup.json"

      - name: Retain populated source rollback backup
        env:
          D1_RELEASE_GENERATION: legacy
        run: pnpm tsx scripts/worker-release.ts backup preview --site "${{ inputs.site_id }}"

      - name: Upload nondestructive Preview backups
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_id }}-d1-replatform-preview-backups-${{ github.sha }}
          path: |
            .wrangler/backups/**/preview/${{ github.sha }}*.sql
            ${{ runner.temp }}/d1-replatform-evidence/source-pre-bootstrap.sql
          if-no-files-found: error
          retention-days: 30

      - name: Apply fresh schema, import controlled data, and verify exact parity
        run: |
          set -euo pipefail
          pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-migration.json"
          pnpm tsx scripts/worker-release.ts migrate preview --site "${{ inputs.site_id }}"
          pnpm tsx scripts/worker-release.ts import preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/preview-first-import.txt"
          pnpm tsx scripts/worker-release.ts verify preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/preview-first-parity.json"
          pnpm tsx scripts/worker-release.ts check-schema preview --site "${{ inputs.site_id }}"
          pnpm tsx scripts/d1-preview-measure.ts parity "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/preview-parity-measurement.json"
          pnpm tsx scripts/d1-preview-attestation-marker.ts install

      - name: Deploy replacement binding from exact commit
        run: |
          pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-deploy.json"
          pnpm tsx scripts/worker-release.ts deploy preview --site "${{ inputs.site_id }}"
          pnpm tsx scripts/d1-replatform-cutover.ts attest-preview --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-worker-attestation.json"

      - name: Install Chromium for protected browser gates
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run critical Catalog and Submission browser journeys
        env:
          E2E_SITE_ID: ${{ inputs.site_id }}
          E2E_SITE_NAME: ${{ inputs.site_id == 'serp.software' && 'SERP Software' || 'Porn Video Downloaders' }}
          E2E_LISTING_COUNT: ${{ inputs.site_id == 'serp.software' && '339' || '286' }}
          E2E_LISTING_NAME: ${{ inputs.site_id == 'serp.software' && '123Movies Video Downloader' || '321tube Video Downloader' }}
          E2E_LISTING_SLUG: ${{ inputs.site_id == 'serp.software' && '123movies-downloader' || '321tube-downloader' }}
          E2E_CATEGORY_SLUG: video-downloaders
          PLAYWRIGHT_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
        run: |
          pnpm --filter e2e exec playwright test tests/multisite-smoke.spec.ts --project=chromium
          pnpm tsx scripts/d1-preview-http-gates.ts preview "${{ inputs.site_id }}" "$PREVIEW_BASE_URL" "$REPLATFORM_EVIDENCE_DIR/catalog-journeys.json"

      - name: Repeat import and prove verified no-op with unchanged parity
        run: |
          set -euo pipefail
          pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-repeat.json"
          pnpm tsx scripts/d1-replatform-cutover.ts attest-preview --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-attestation-before-repeat.json"
          pnpm tsx scripts/worker-release.ts import preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/preview-repeat-import.txt"
          grep -F "import is a no-op" "$REPLATFORM_EVIDENCE_DIR/preview-repeat-import.txt"
          pnpm tsx scripts/worker-release.ts verify preview --site "${{ inputs.site_id }}" | tee "$REPLATFORM_EVIDENCE_DIR/preview-repeat-parity.json"
          cmp "$REPLATFORM_EVIDENCE_DIR/preview-first-parity.json" "$REPLATFORM_EVIDENCE_DIR/preview-repeat-parity.json"
          pnpm tsx scripts/d1-preview-measure.ts parity "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/preview-repeat-measurement.json"

      - name: Run real isolated D1-backed Submission journeys
        run: |
          pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-submissions.json"
          pnpm tsx scripts/d1-replatform-cutover.ts attest-preview --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-attestation-before-submissions.json"
          pnpm tsx scripts/d1-preview-submission-journey.ts "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/submission-journeys.json" "$REPLATFORM_EVIDENCE_DIR/submission-recovery-journal.json"
          pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/submission-cleanup-identity.json"
          pnpm tsx scripts/d1-preview-submission-recovery.ts "$REPLATFORM_EVIDENCE_DIR/submission-recovery-journal.json" "$REPLATFORM_EVIDENCE_DIR/submission-cleanup-identity.json" "$REPLATFORM_EVIDENCE_DIR/submission-cleanup-result.json"
          pnpm tsx scripts/d1-preview-measure.ts parity "${{ inputs.site_id }}" "$REPLATFORM_EVIDENCE_DIR/preview-post-journey-measurement.json"

      - name: Rehearse nondestructive old-binding rollback and restoration
        run: |
          set -euo pipefail
          pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-rollback.json"
          D1_RELEASE_GENERATION=legacy pnpm tsx scripts/worker-release.ts deploy preview --site "${{ inputs.site_id }}"
          pnpm tsx scripts/d1-preview-http-gates.ts preview "${{ inputs.site_id }}" "$PREVIEW_BASE_URL" "$REPLATFORM_EVIDENCE_DIR/rollback-source.json"
          pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-identity-before-restoration.json"
          pnpm tsx scripts/worker-release.ts deploy preview --site "${{ inputs.site_id }}"
          pnpm tsx scripts/d1-replatform-cutover.ts attest-preview --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/preview-attestation-after-restoration.json"
          pnpm tsx scripts/d1-preview-http-gates.ts preview "${{ inputs.site_id }}" "$PREVIEW_BASE_URL" "$REPLATFORM_EVIDENCE_DIR/rollback-target.json"

      - name: Build and validate sealed exact-commit Preview receipt
        run: |
          sanitizer_args=()
          if [ "${{ inputs.site_id }}" = 'pornvideodownloaders.com' ]
          then
            sanitizer_args+=(
              --sanitization-journal "$REPLATFORM_EVIDENCE_DIR/pvd-sanitization-journal.json"
              --sanitization-result "$REPLATFORM_EVIDENCE_DIR/pvd-sanitization-result.json"
            )
          fi
          pnpm tsx scripts/d1-preview-evidence.ts --site "${{ inputs.site_id }}" --identity "$REPLATFORM_EVIDENCE_DIR/preview-identity.json" --initial-worker-deployment "$REPLATFORM_EVIDENCE_DIR/preview-source-worker-deployment.json" --secret-worker-deployment "$REPLATFORM_EVIDENCE_DIR/preview-secret-worker-deployment.json" --worker-attestation "$REPLATFORM_EVIDENCE_DIR/preview-worker-attestation.json" --source-classification "$REPLATFORM_EVIDENCE_DIR/source-classification.json" --source-final-classification "$REPLATFORM_EVIDENCE_DIR/source-final-classification.json" --source-controlled "$REPLATFORM_EVIDENCE_DIR/source-controlled.json" --source-repeat-import "$REPLATFORM_EVIDENCE_DIR/source-repeat-import.txt" --preflight "$REPLATFORM_EVIDENCE_DIR/preview-preflight.json" --first-import "$REPLATFORM_EVIDENCE_DIR/preview-first-import.txt" --first-parity "$REPLATFORM_EVIDENCE_DIR/preview-first-parity.json" --measurement "$REPLATFORM_EVIDENCE_DIR/preview-parity-measurement.json" --repeat-parity "$REPLATFORM_EVIDENCE_DIR/preview-repeat-parity.json" --repeat-measurement "$REPLATFORM_EVIDENCE_DIR/preview-repeat-measurement.json" --post-journey-measurement "$REPLATFORM_EVIDENCE_DIR/preview-post-journey-measurement.json" --catalog-journeys "$REPLATFORM_EVIDENCE_DIR/catalog-journeys.json" --submission-journeys "$REPLATFORM_EVIDENCE_DIR/submission-journeys.json" --submission-cleanup "$REPLATFORM_EVIDENCE_DIR/submission-cleanup-result.json" --rollback-source "$REPLATFORM_EVIDENCE_DIR/rollback-source.json" --rollback-target "$REPLATFORM_EVIDENCE_DIR/rollback-target.json" "${sanitizer_args[@]}" --output "$REPLATFORM_EVIDENCE_DIR/preview-evidence.json"

      - name: Seal trusted Preview evidence
        run: pnpm tsx scripts/d1-replatform-cutover.ts seal-preview --file "$REPLATFORM_EVIDENCE_DIR/preview-evidence.json" > "$REPLATFORM_EVIDENCE_DIR/preview-receipt.json"

      - name: Retain sealed Preview evidence and browser artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_id }}-d1-replatform-preview-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/d1-replatform-evidence/
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient Preview rehearsal authority and binding marker
        if: always()
        run: |
          set +e
          cleanup_status=0
          if [ -f "$REPLATFORM_EVIDENCE_DIR/PREEXISTING_AUTHORITY_RECOVERY_REQUIRED" ]
          then
            printf '%s\n' 'Preexisting rehearsal authority requires manual recovery; automatic cleanup was not attempted.' >> "$REPLATFORM_EVIDENCE_DIR/MANUAL_RECOVERY_REQUIRED.txt"
            exit 1
          fi
          if [ ! -f "$REPLATFORM_EVIDENCE_DIR/transient-authority-install-attempted" ]
          then
            printf '%s\n' 'No transient authority or binding marker was installed; no remote cleanup was required.' > "$REPLATFORM_EVIDENCE_DIR/NO_REMOTE_CLEANUP_REQUIRED.txt"
            exit 0
          fi
          if ! pnpm tsx scripts/d1-replatform-cutover.ts verify-preview-identity --site "${{ inputs.site_id }}" > "$REPLATFORM_EVIDENCE_DIR/final-cleanup-identity.json"
          then
            printf '%s\n' 'Fresh identity verification failed; no remote cleanup mutation was attempted.' > "$REPLATFORM_EVIDENCE_DIR/MANUAL_RECOVERY_REQUIRED.txt"
            exit 1
          fi
          pnpm tsx scripts/d1-preview-authority-probe.ts before "$REPLATFORM_EVIDENCE_DIR/authority-probe.json" || cleanup_status=1
          if [ -f "$REPLATFORM_EVIDENCE_DIR/submission-recovery-journal.json" ]
          then
            pnpm tsx scripts/d1-preview-submission-recovery.ts "$REPLATFORM_EVIDENCE_DIR/submission-recovery-journal.json" "$REPLATFORM_EVIDENCE_DIR/final-cleanup-identity.json" "$REPLATFORM_EVIDENCE_DIR/final-submission-cleanup-result.json" || cleanup_status=1
          fi
          pnpm tsx scripts/d1-preview-attestation-marker.ts delete || cleanup_status=1
          for key in \
            REPLATFORM_PREVIEW_SIGNING_SECRET \
            REPLATFORM_PREVIEW_BINDING_NONCE \
            REPLATFORM_PREVIEW_INTAKE_SECRET \
            REPLATFORM_PREVIEW_RUN_ID \
            REPLATFORM_PREVIEW_COMMIT_SHA \
            REPLATFORM_PREVIEW_WORKER_NAME
          do
            pnpm exec wrangler secret delete "$key" --name "$CLOUDFLARE_WORKER_PREVIEW_NAME" || cleanup_status=1
          done
          pnpm exec wrangler secret list --name "$CLOUDFLARE_WORKER_PREVIEW_NAME" --format json > "$RUNNER_TEMP/replatform-secret-names-after-cleanup.json" || cleanup_status=1
          node -e '
            const fs = require("node:fs");
            const names = new Set(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).map(item => item.name));
            const removed = ["REPLATFORM_PREVIEW_SIGNING_SECRET", "REPLATFORM_PREVIEW_BINDING_NONCE", "REPLATFORM_PREVIEW_INTAKE_SECRET", "REPLATFORM_PREVIEW_RUN_ID", "REPLATFORM_PREVIEW_COMMIT_SHA", "REPLATFORM_PREVIEW_WORKER_NAME"];
            if (removed.some(name => names.has(name))) throw new Error("Transient Preview Worker authority remains installed.");
          ' "$RUNNER_TEMP/replatform-secret-names-after-cleanup.json" || cleanup_status=1
          pnpm tsx scripts/d1-preview-attestation-marker.ts assert-absent || cleanup_status=1
          pnpm tsx scripts/d1-preview-authority-probe.ts after "$REPLATFORM_EVIDENCE_DIR/authority-probe.json" || cleanup_status=1
          rm -f "$RUNNER_TEMP"/REPLATFORM_PREVIEW_*
          exit "$cleanup_status"

      - name: Retain cleanup and manual-recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.site_id }}-d1-replatform-cleanup-${{ github.sha }}
          path: ${{ runner.temp }}/d1-replatform-evidence/
          if-no-files-found: error
          retention-days: 30
