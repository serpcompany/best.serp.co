name: Submit GSC Sitemaps

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify credentials, list registered sitemaps, or submit canonical sitemaps'
        required: true
        default: verify-credentials
        type: choice
        options:
          - verify-credentials
          - list-sitemaps
          - submit
      site_ids:
        description: 'Optional newline or comma separated checked-in site ids to submit'
        required: false
        type: string
      stale_sitemap_urls:
        description: 'Optional newline or comma separated stale sitemap URLs to delete before submit'
        required: false
        type: string
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  submit:
    name: Submit sitemap indexes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install

      - name: Verify Search Console credentials
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_QUOTA_PROJECT: ${{ secrets.GSC_QUOTA_PROJECT }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            exit 0
          fi

          if [ -n "$GSC_OAUTH_CLIENT_ID" ] && [ -n "$GSC_OAUTH_CLIENT_SECRET" ] && [ -n "$GSC_OAUTH_REFRESH_TOKEN" ] && [ -n "$GSC_QUOTA_PROJECT" ]; then
            exit 0
          fi

          {
            echo "Missing Search Console credentials."
            echo "Set either GSC_SERVICE_ACCOUNT_JSON or all OAuth secrets:"
            echo "GSC_OAUTH_CLIENT_ID, GSC_OAUTH_CLIENT_SECRET, GSC_OAUTH_REFRESH_TOKEN,"
            echo "and GSC_QUOTA_PROJECT."
          } >&2
          exit 1

      - name: Submit sitemaps
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_QUOTA_PROJECT: ${{ secrets.GSC_QUOTA_PROJECT }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL_MAP: ${{ vars.GSC_SITE_URL_MAP }}
          GSC_SITE_IDS: ${{ github.event.inputs.site_ids }}
          GSC_STALE_SITEMAP_URLS: ${{ github.event.inputs.stale_sitemap_urls || vars.GSC_STALE_SITEMAP_URLS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "verify-credentials" ]; then
            pnpm tsx scripts/submit-gsc-sitemaps.ts --verify-credentials
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "list-sitemaps" ]; then
            pnpm tsx scripts/submit-gsc-sitemaps.ts --list-sitemaps
          else
            pnpm tsx scripts/submit-gsc-sitemaps.ts
          fi
