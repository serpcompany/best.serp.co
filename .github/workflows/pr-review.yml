name: PR Review

# Required checks for every pull request into staging (the base branch) and main (promotions
# from staging and hotfixes). Every job runs on every PR: a skipped job satisfies a required
# check, so nothing here is path-filtered.
on:
  pull_request:
    branches: ['staging', 'main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job except E2E runs where CI_RUNNER_LABELS points, and a fork's pull request always runs
# on ubuntu-latest (docs/HARNESS.md#ci-runners).
jobs:
  validate:
    name: Validate Site & Policy
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Catches a pull request opened against the wrong base: main changes only by the owner's
      # fast-forward promotion (`pnpm release:promote`, no pull request) or a hotfix-* pull
      # request. It is an accident guard, not the control: a pull request runs its own copy of
      # this file. The control is Deploy Production's release-time tree check
      # (docs/RELEASE_GUARDS.md#promotion).
      - name: Require a hotfix branch for pull requests into main
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Exit code 2 means no matching ref; any other failure fails closed.
          if refs="$(git ls-remote --exit-code origin refs/heads/staging)"; then status=0; else status=$?; fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::Could not list the staging branch (git ls-remote exited $status); failing closed."
            exit 1
          fi
          if ! awk '$2 == "refs/heads/staging" { found = 1 } END { exit !found }' <<<"$refs"; then
            echo "No staging branch exists yet, so main still accepts every pull request."
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && [[ "$HEAD_REF" =~ ^hotfix-[A-Za-z0-9._-]+$ ]]; then
            exit 0
          fi
          echo "::error::main is production: it accepts only hotfix-* pull requests, and staging reaches it by the owner's fast-forward promotion, not a pull request. Retarget this pull request to staging (docs/RELEASE_GUARDS.md#promotion)."
          exit 1

      - name: Install
        uses: ./.github/actions/install

      - name: Validate repository documentation
        run: pnpm docs:check

      - name: Validate Worker configuration contracts
        run: pnpm worker:config:validate

      - name: Run Biome Check
        run: |
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "origin/$GITHUB_BASE_REF...HEAD" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.jsonc' '*.css'
          )
          if ((${#changed_files[@]} == 0)); then
            echo "No Biome-supported files changed; skipping."
            exit 0
          fi
          pnpm exec biome check --no-errors-on-unmatched "${changed_files[@]}"

      - name: Run forbidden listing link guard
        run: pnpm lint:forbidden-links

      - name: Run repository policy tests
        run: pnpm test:repo

      - name: Run D1 contract tests
        run: pnpm test:d1

  typecheck:
    name: Type Check
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run type check
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run tests
        run: pnpm test

  worker-build:
    name: OpenNext Worker Build
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Build OpenNext Worker
        run: pnpm worker:build

  e2e:
    name: E2E Tests
    # Installs Playwright browsers, so it never leaves GitHub-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Install Playwright Browsers
        run: pnpm --filter e2e test:install

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30
