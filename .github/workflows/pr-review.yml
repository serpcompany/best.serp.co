name: PR Review

# Required checks for every pull request into staging (the base branch) and main (promotions
# from staging and hotfixes). Every job runs on every PR: a skipped job satisfies a required
# check, so nothing here is path-filtered.
on:
  pull_request:
    branches: ['staging', 'main']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Site & Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a promotion or hotfix branch for pull requests into main
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if ! git ls-remote --exit-code --heads origin staging > /dev/null; then
            echo "No staging branch exists yet, so main still accepts every pull request."
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && { [ "$HEAD_REF" = "staging" ] || [[ "$HEAD_REF" == hotfix-* ]]; }; then
            exit 0
          fi
          echo "::error::main is production and accepts only a promotion from staging or a hotfix-* branch. Retarget this pull request to staging (docs/RELEASE_GUARDS.md#promotion)."
          exit 1

      - name: Install
        uses: ./.github/actions/install

      - name: Validate repository documentation
        run: pnpm docs:check

      - name: Validate Worker configuration contracts
        run: pnpm worker:config:validate

      - name: Run Biome Check
        run: |
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "origin/$GITHUB_BASE_REF...HEAD" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.jsonc' '*.css'
          )
          if ((${#changed_files[@]} == 0)); then
            echo "No Biome-supported files changed; skipping."
            exit 0
          fi
          pnpm exec biome check --no-errors-on-unmatched "${changed_files[@]}"

      - name: Run forbidden listing link guard
        run: pnpm lint:forbidden-links

      - name: Run repository policy tests
        run: pnpm test:repo

      - name: Run D1 contract tests
        run: pnpm test:d1

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run type check
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run tests
        run: pnpm test

  worker-build:
    name: OpenNext Worker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Build OpenNext Worker
        run: pnpm worker:build

  # links:
  #   name: Check Links
  #   runs-on: self-hosted
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7

  #     - name: Check Links
  #       uses: lycheeverse/lychee-action@v2.2.0
  #       with:
  #         args: --config ./lychee.toml --verbose --no-progress .
  #         fail: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Install Playwright Browsers
        run: pnpm --filter e2e test:install

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30
