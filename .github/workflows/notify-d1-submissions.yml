name: Notify Verified D1 Submissions

# Every 15 minutes, opens an assigned review issue for each badge-verified production
# submission (scripts/d1-submission-notifier.ts). GitHub runs schedules on the default branch;
# when that is staging, the relay job re-dispatches this workflow on main, so only main's code
# ever touches production data. Both jobs are skipped until the repository variable
# SUBMISSION_REVIEWER_GITHUB_LOGIN is set, and the notify steps are skipped until the
# production-notifier environment holds Cloudflare credentials. It uses its own environment
# because the production environment requires reviewer approval. See docs/DEPLOY_RUNBOOK.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  relay:
    name: Run the scheduled notifier on main
    if: github.event_name == 'schedule' && github.ref != 'refs/heads/main' && vars.SUBMISSION_REVIEWER_GITHUB_LOGIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notify-d1-submissions.yml --ref main --repo "$GITHUB_REPOSITORY"

  notify:
    name: Notify the submission reviewer
    if: github.ref == 'refs/heads/main' && vars.SUBMISSION_REVIEWER_GITHUB_LOGIN != ''
    # Job-level, so a skipped run never joins the group or replaces a queued notification.
    concurrency:
      group: best-serp-co-production-notifier
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    environment:
      name: production-notifier
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          message="Submission notification skipped: the production-notifier environment has no CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/DEPLOY_RUNBOOK.md)."
          echo "::warning title=Submission notification skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout reviewed source
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Install
        if: steps.credentials.outputs.configured == 'true'
        uses: ./.github/actions/install

      - name: Notify the configured submission reviewer
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 404ec437-53a2-4fbc-8b5f-b5e69065708e
          GITHUB_TOKEN: ${{ github.token }}
          SUBMISSION_REVIEWER_GITHUB_LOGIN: ${{ vars.SUBMISSION_REVIEWER_GITHUB_LOGIN }}
        run: pnpm db:notify:production
