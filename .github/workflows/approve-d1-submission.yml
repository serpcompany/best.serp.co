name: Review D1 Submission

# Approves (publishes) or rejects one badge-verified submission in production D1 after
# exporting a backup (kept 30 days), then comments on and closes its review issue.
# scripts/d1-submission-approver.ts re-checks main, this workflow, and the typed confirmation.
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Badge-verified D1 submission UUID (from the review issue)'
        required: true
        type: string
      decision:
        description: 'approve publishes a verified submission; reject declines a pending or verified one'
        required: true
        type: choice
        options:
          - approve
          - reject
      confirmation:
        description: 'Type approve-best.serp.co-submission-production'
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: Check ref, submission, and confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Require main, a submission UUID, and the typed confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Submission review runs only from main, not $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$SUBMISSION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::submission_id must be the submission UUID from the review issue."
            exit 1
          fi
          if [ "$CONFIRMATION" != "approve-best.serp.co-submission-production" ]; then
            echo "::error::Type approve-best.serp.co-submission-production to review a submission."
            exit 1
          fi

  review:
    name: Back up, review, and close the issue
    needs: [authorize]
    # Job-level, so a run refused by authorize never replaces a valid queued production job.
    concurrency:
      group: deploy-best-serp-co-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    environment:
      name: production
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The production environment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/DEPLOY_RUNBOOK.md)."
            exit 1
          fi

      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run D1 contract tests
        run: pnpm test:d1

      - name: Back up production D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_CONFIRM: ${{ inputs.confirmation }}
        run: pnpm tsx scripts/cloudflare-release.ts backup production --output "$RUNNER_TEMP/d1-backup/best-serp-co-production-$GITHUB_SHA-$GITHUB_RUN_ID.sql"

      - name: Retain pre-review backup
        uses: actions/upload-artifact@v7
        with:
          name: best-serp-co-production-d1-pre-review-${{ github.run_id }}
          path: ${{ runner.temp }}/d1-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Review D1 submission
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 404ec437-53a2-4fbc-8b5f-b5e69065708e
          D1_SUBMISSION_APPROVAL_CONFIRM: ${{ inputs.confirmation }}
          DECISION: ${{ inputs.decision }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: pnpm db:approve:production -- "$SUBMISSION_ID" "$DECISION"

      - name: Close the review issue
        uses: actions/github-script@v9
        env:
          SUBMISSION_DECISION: ${{ inputs.decision }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          SUBMISSION_REVIEWER: ${{ github.actor }}
        with:
          script: |
            const marker = `<!-- d1-submission: best.serp.co:${process.env.SUBMISSION_ID} -->`
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            })
            const issue = issues.find(item => !item.pull_request && item.body?.includes(marker))
            if (!issue) {
              core.notice('No GitHub review issue exists for this D1 submission.')
              return
            }
            if (issue.state === 'closed') {
              core.notice(`Review issue #${issue.number} is already closed.`)
              return
            }
            const outcome =
              process.env.SUBMISSION_DECISION === 'approve'
                ? 'approved and published'
                : 'declined without publishing'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `D1 submission **${outcome}** by @${process.env.SUBMISSION_REVIEWER}.`
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: process.env.SUBMISSION_DECISION === 'approve' ? 'completed' : 'not_planned'
            })
