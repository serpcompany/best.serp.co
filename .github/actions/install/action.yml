name: Setup project dependencies

description: "Setup project dependencies"

runs:
  using: "composite"
  steps:
    # A self-hosted runner keeps the host between jobs: give each job its own temporary
    # directory, which the runner empties when the job starts and ends.
    - name: Scope temporary files to this job
      if: runner.environment == 'self-hosted'
      shell: bash
      run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      id: pnpm-install
      with:
        # The version comes from package.json's packageManager.
        run_install: false
        dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        registry-url: "https://registry.npmjs.org"
        cache: "pnpm"

    # No `.next/cache` from an earlier run: it holds Turbopack's build cache, and builds restored
    # from it served a stale globals.css (no `--site-header-height`, so Visit Site stopped sticking
    # on phones) to e2e. Every CI build, deploys included, compiles the tree it checked out.
    # setup-node above caches the pnpm store.
    - name: Install dependencies
      shell: bash
      run: pnpm install
