# serpcompany/best.serp.co#546: retire or re-describe listings whose product is gone or has pivoted,
# found by #539's alternatives batches (#542, #544, #545, #547, #548) and checked again here. The
# owner approved it on 2026-10-18 ("okay do it"). Each listing's own site was read on 2026-10-18; the
# comment above each operation says what it showed.
# - Gone (20) and unrelated (14): listing-unpublish. Gone means dead, parked, shut down,
#   absorbed into another company with no listing to send it to, or only a waitlist for something
#   never launched; unrelated means the site now sells something else. The page answers 410 Gone
#   with #517's removed-listing page, and leaves the sitemap, search, RSS and category pages.
#   The row stays: Republish in /admin brings it back. A hygiene removal, so not `unowned`: the
#   listing comes down even if someone owns or claimed it, as the dead-domain and #340 removals do.
# - Successor (2): unpublished here, then 2026-10-18-retire-dead-listings-redirects.yaml sends each
#   slug to its successor's live page with a permanent redirect (308). A manifest names a listing
#   once, so the redirects need their own manifest, published after this one.
# - Rename (4): listing-details-set, for a product that was renamed or acquired but is the same
#   kind and whose long description still describes it (#340 decision 3). The name and short
#   description change; the website only for Datasette, whose link opened a defunct plugin.
# Not here, and listed in the PR for the next round: listings still picked as an alternative in an
# open alternatives manifest (#544, #545, #547, #548), whose publication a retirement would refuse;
# the fan-site downloaders the owner keeps; and apps.serp.co tools.
# Ids are the v1 import's, the same on staging and production. Each slug is in production's
# sitemap-products.xml, and its production page showed the website and category below (2026-10-18).
# Row-level: a listing whose slug, website, categories, name or description changed, that is no
# longer live, or whose own submission is in review refuses the whole batch, with nothing written.
# Apply staging first, then production after promotion.
