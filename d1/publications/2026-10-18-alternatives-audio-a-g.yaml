# serpcompany/best.serp.co#539 (batch E): hand-picked alternatives for the 36 live listings whose
# primary category is Audio and whose slug starts with a to g (autopod.fm to goodtape.io), the first
# part of Audio in #539's size order; a later batch takes h to z. The picks lead each page's
# Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do and what their sites offer that day: a pick does the same job for the same
# kind of user, best first, and a listing gets fewer than six, or none, when nothing else fits.
# Every listing and pick is a v1 import listing, with the same id and slug on staging and
# production. The reason for each listing is the comment above its operation. Picks may come from
# any category: Kapwing, Veed, Submagic, Captions, Gling and Fliki are filed under Video, Dubverse
# and RadioNewsAI under Writing, Soundraw under Image & Design, and Otter.ai under Productivity.
# Free Subtitles AI (freesubtitles.ai) now redirects to its new name, Subtitles.app, and RadioNewsAI
# (radionewsai.com) to Audio.co; both still offer what their listings describe.
# Two listings have no operation, because nothing in the catalog substitutes for them: Cyanite
# (cyanite.ai) and Dadabots (dadabots.com). Their pages keep the similar-listings fallback.
# Five listings have no operation, because their sites no longer offer what the listing describes
# (pivoted, shut down, or a repurposed domain), and batch E's pull request lists them for
# retirement: Balacoon (balacoon.com), Beatsbrew (beatsbrew.com), Blogcast (blogcast.host),
# Clonemyvoice (clonemyvoice.io), and Charactr (gemelo.ai).
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
