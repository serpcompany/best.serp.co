# serpcompany/best.serp.co#539 (batch F): hand-picked alternatives for the 86 live listings whose
# primary category is Audio & Music and whose slug starts with h to z (hookgen.com to
# wondercraft.ai), the rest of Audio & Music after batch E's a to g. The picks lead each page's
# Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. That day each listing's site and
# each pick's site was read to confirm it still offers the product its listing describes; four that
# block scripts (Melody Studio, Tapesearch, TTSMaker and Vocal Remover at vocalremover.org) were
# read in a browser, as was async.com's "Formerly Podcastle" label.
# Picks may come from any category: Imentiv is filed under Developer Tools, Soundraw under Image &
# Design, Otter.ai, Suki, Nabla, ScribeBerry and fireflies.ai under Productivity, and Dubverse and
# Rask.ai under Writing. Every listing and pick is a v1 import listing, with the same id and slug on
# staging and production. The reason for each listing is the comment above its operation.
# Three listings whose sites moved to a new name but still offer the listed product get picks and
# are to be re-described in #546: Podcastle (podcastle.ai, now Async, "Formerly Podcastle"),
# Supertone (supertone.ai, now Antinode Audio, where Supertone Shift continues as Antinode Shift)
# and TranscribeMe (transcribeme.app, now TranscribeGo, which still runs the TranscribeMe WhatsApp
# and Telegram bots).
# Thirteen listings have no operation. Four because nothing in the catalog substitutes for them on
# 2026-10-18: Playlistnameai (naming playlists; the playlist tools build playlists, not names),
# Sonify (data sonification, turning data into sound), Tapesearch (searching podcast transcripts and
# alerting on mentions; the podcast apps summarize episodes for listeners) and TTSLabs (text-to-
# speech that reads Twitch viewers' messages aloud live on stream). Eight because their sites don't
# offer the listed product on 2026-10-18, so they are retirement candidates and no listing picks
# them: Koe Recast (koe.ai, a blank page), Listener.fm (listener.fm, redirects to Listener, campaign
# reporting for podcast networks), Live Captions (live-captions.com, a parked domain), Muzaic.studio
# (muzaic.studio, redirects to an unrelated deals site), Splashmusic (splashmusic.com, now a Roblox
# music game), Transcribethis (transcribethis.io, Cloudflare error 526), Voiceful.io (voiceful.io,
# the domain does not resolve) and Wavtool (wavtool.com, gone offline). One, Orb Producer
# (orbplugins.com), because it redirects to LANDR Composer, now part of LANDR, which has its own
# listing; it is to be redirected to /products/landr.com/ in #546, so no listing picks it. Their
# pages keep the similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
