# serpcompany/best.serp.co#539 (batch C): hand-picked alternatives for the 68 live listings whose
# primary category is Video and whose slug starts with g to z (gemoo.com to zeemo.ai), the rest of
# Video after batch B's a to f. The picks lead each page's Alternatives section; the page tops it
# up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. That day each listing's site and
# each pick's site was read to confirm it still offers the product its listing describes; two that
# block scripts (Autodesk Flow Studio, Canva) were read from their latest Internet Archive snapshot.
# Picks may come from any category: HeyGen, the motion-capture and the photo-upscaling tools are
# filed under Image & Design, Descript and the subtitle tools under Audio & Music, the dubbing tools
# under Writing, Creatify under Marketing & SEO and Scribe under Productivity.
# Runway has two listings (runway.ml, runwayml.com) and Topaz Labs two (topaz.ai, topazlabs.com);
# neither pair picks each other, and other listings name runwayml.com only. Every listing and pick
# is a v1 import listing, with the same id and slug on staging and production. The reason for each
# listing is the comment above its operation.
# Ten listings have no operation. Three because nothing in the catalog substitutes for them:
# LiveReacting (interactive and pre-recorded live streams), Storylane (interactive product demos)
# and VidDay (group video gifts). Seven because their sites don't offer the listed product today, so
# they are retirement candidates and no listing picks them: Gemoo (a scheduled-maintenance page),
# Munch (getmunch.com redirects to Munch Studio, a done-for-you social media service), Latte
# (sunsetting), Oxolo (now construction documentation software), Shuffll (now personalized video
# generated from customer data), Supercreator (sunset) and Vidnami (vidnamipro.com is an information
# page about Vidnami). Their pages keep the similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
