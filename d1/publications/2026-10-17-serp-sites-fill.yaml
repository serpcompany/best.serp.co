    slug: serplists.com
    reason: '#523: the listing had no description'
    expected:
      content: null
    content: |-
      SERP Lists is a checklist app for repeatable work. You build a checklist once as a template, run it as many times as you need with each run's progress tracked on its own, and share the result or publish the template for others to reuse. It is made for teams and solo operators who need the same process done cleanly more than once, so they stop rebuilding the same checklist in documents and spreadsheets.

      ## SERP Lists Overview

      SERP Lists works in three steps:

      1. **Make a template.** Capture a repeatable process once, with sections, tasks, rich instructions, and ownership context.
      2. **Run the workflow.** Start a fresh run from the template, move through it task by task, and keep the run's progress separate from the source template.
      3. **Share the result.** Share a run's link so anyone can tick tasks, add notes, and complete it, or publish the template so others can reuse the work.

      ## Template Builder

      Templates are reusable standard operating procedures built from sections and tasks. They can carry instructions, media, and structured sub-items, and one source template serves every repeat of the process. The site's sample Full Website Launch QA Checklist, for example, uses Markdown instructions, subtasks, video review, image proof, file references, and external QA embeds.

      ## Checklist Runs

      A new run can be launched from any saved template. Every run gets its own progress, task focus, completion states, and a link to pick it up again, while the template itself stays unchanged for the next run.

      ## Template Library and Sharing

      The Template Library holds checklist templates published by the community, organized by category and covering SOPs, audits, launches, onboarding flows, and field checklists. Starter templates include a Complete Wedding Planning Checklist, the Full Website Launch QA Checklist, and an Ultimate Camping Checklist, and any of them can be adapted to your own process.

      You can publish your own templates to a public profile and share their links, which keep a stable structure. Sharing a run is separate from publishing a template, and public share pages show what was done without exposing private dashboard controls.

      ## Import and Export

      Templates can be exported as portable JSON packs and imported back into the app, which makes it possible to back them up, move them between accounts, or keep SOP content under version control in a repository. Import and export are part of the Pro plan.

      ## Pricing

      SERP Lists has a free plan and a Pro plan. The free plan covers creating templates with sections and items, running checklists and tracking progress, and browsing public checklists. Pro costs $9 a month, can be cancelled anytime, and adds template import and export, saving public templates to your account, and billing management in account settings. Payments and subscriptions are handled by Stripe.
