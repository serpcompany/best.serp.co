    id: lst_e7dc82255f70c7bb508c6d12
    slug: tools.serp.co
    reason: '#523: the listing had no description'
    expected:
      content: null
    content: |-
      SERP Tools is a free collection of browser-based file tools from SERP. It converts, compresses, views, and edits images, audio, video, PDFs, and data files. Its converter pages say files are processed locally, so they stay on your device, and there is no software to install.

      ## SERP Tools Overview

      The site groups its tools into categories such as Convert, Compress, Combine, Bulk Operations, Edit, and PDF, and you can browse them by category or filter one long list. Each converter has its own page with a drop zone for your files, a short comparison of the source and target formats, step-by-step instructions, related tools, common questions, and a changelog.

      The converter pages describe the same approach throughout: the tool runs in the browser with no uploads required, keeps your original file untouched, and works on modern desktop and mobile browsers.

      ## File Conversion

      Convert is by far the largest category, with about 2,200 tools. They cover:

      - **Images:** PNG to JPG, AVIF to WebP, BMP to ICO, camera RAW files such as Sony ARW and Canon CR2 to JPG, and less common formats like TGA, DDS, PCX, and XBM.
      - **Audio:** conversions between AAC, FLAC, MP3, WAV, OGG, Opus, and other formats, plus CD audio tracks to FLAC, MP3, or WAV.
      - **Video:** 3GP, AVI, MOV, MKV, and other formats to MP4, WebM, and more, and audio extraction from video, such as MP4 to MP3, AAC, FLAC, M4A, OGG, Opus, or WAV.

      A few converters solve specific problems. One recovers a picture saved as a `.bin` file, such as an Outlook `ATT00001.bin` attachment, as a JPG or PNG. GIF to JPG extracts a GIF's first frame as a JPG, and GIF to PNG extracts its frames as PNG images.

      ## Compression

      The Compress category has 22 tools: compressors for images (AVIF, BMP, GIF, JPEG, SVG, TIFF, WebP), audio (AAC, FLAC, M4A, MP3, OGG, WAV), video (AVI, FLV, MKV, MOV, MP4, WebM), and PDF files, and a Batch PNG Compressor that compresses several PNG files at once and downloads them as a ZIP. A separate PNG Optimizer is also available.

      ## Editors, PDF Tools, and Utilities

      SERP Tools includes an Audio Editor, an Image Editor, and a Video Editor that work in the browser. Its PDF tools are a PDF Editor, a PDF Reader, and a PDF Viewer, with versions of their pages for Mac and Windows users.

      Smaller utilities round out the collection: a Character Counter for characters, words, and lines; a CSV Combiner that merges several CSV files into one; Audio to Text and Audio to Transcript tools that transcribe audio and video files; and a YouTube Transcript Generator.
