    content: |-
      SERP Games is a free online games site in SERP's network of sites. Its library has more than 2,500 games that you play directly in your web browser, from classics such as 2048, Minesweeper, Sudoku, and Wordle Unlimited to arcade, driving, sports, and puzzle games.

      ## SERP Games Overview

      The home page opens on the whole library, with quick filters for game types such as Arcade, Maze, Logic, Brain Teaser, Skill, Jumping, Obstacle Course, Puzzle, Simulation, Driving, Exploration, and Vehicles. Games can also be browsed by category and by tag, and a Brands page links to the other sites in the SERP network.

      The site is available in six languages: English, German, Spanish, French, Portuguese, and Japanese.

      ## Categories

      The categories page lists 93 categories, each with its number of games. The largest are Arcade (about 900 games), Skill (about 520), Puzzle (about 370), Brain (about 340), Strategy, Platformer, Classic, Shooter, Sports, and Driving. Smaller categories cover narrower interests, such as Educational, Typing, Chess, Cooking, Basketball, Soccer, Fishing, and Parkour games.

      ## Game Pages

      Each game has its own page where you play it in the browser. Next to the game, the page explains how to get started, lists the controls (for 2048, the arrow keys or a swipe to move tiles), and answers common questions, such as what kind of game it is and whether it is free to play. It also gives tips and strategy, links to the game's categories and tags, and suggests about 40 similar games to try next.

      ## Who It Is For

      SERP Games is for anyone who wants a quick game without installing anything: a short puzzle break, a driving or running game, or an old favorite like Flappy Bird, Doodle Jump, or Cookie Clicker. Every game is free, and nothing needs to be downloaded before you play.
  - action: listing-content-set
