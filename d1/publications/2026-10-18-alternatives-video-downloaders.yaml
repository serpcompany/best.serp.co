# serpcompany/best.serp.co#539 (batch A): hand-picked alternatives for the 55 live listings whose
# primary category is Video Downloaders, the next category in #539's order (categories by size). The
# picks lead each page's Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. Almost every listing here saves one
# site's media, and another site's downloader can't do that job, so the picks are the listings that
# can save the same site's media: M3U8 Stream Downloader where the listing says the site serves HLS
# streams, and, for course and community platforms, the Loom, Vimeo, YouTube, Wistia and SproutVideo
# downloaders for lessons embedded from the hosts each listing names. No listing picks SERP Video
# Downloader (serp-video-downloader): its product page says "Coming Soon!", so nobody can switch to
# it yet. It can be added in a later batch once it launches. Its own listing keeps an operation,
# because M3U8 Stream Downloader is available now. Notes (serp-notes) is filed here but is a
# browser notes app, so it gets notes apps. Every listing and pick is a v1 import listing, with the
# same id and slug on staging and production. The reason for each listing is the comment above its
# operation.
# Thirty-one listings have no operation, because nothing live in the catalog substitutes for them:
# - The Adobe Stock, Alamy, DeviantArt, Getty Images, Pinterest, Rawpixel, Unsplash and VectorStock
#   downloaders: each batch-saves one site's images or your licensed files there, and no other
#   listing is built for those sites.
# - Fansly Live Downloader records broadcasts as they happen, which no other listing says it does.
# - Thumbnail Downloader saves a YouTube thumbnail on its own.
# - The Facebook, Hulu, Instagram, Internet Archive, LinkedIn, Netflix, Nicovideo, OnlyFans,
#   Patreon, Pexels, Reddit, Skillshare, Snapchat, Soundgasm, Terabox, TikTok, Twitter X, Udemy and
#   YouTube downloaders: SERP Video Downloader was their only pick.
# - M3U8 Stream Downloader saves HLS streams from any site; SERP Video Downloader was its only pick.
# - OnlyFans Bulk Downloader: its link opens OnlyFans Downloader and its own product page is gone,
#   so it is up for retirement (#546).
# Their pages keep the similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
