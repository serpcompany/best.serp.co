      ## FAQ


      ### How do I download a video from Pornhub?


      Open a video page on Pornhub, press play, then click the in-player button, popup action, or context-menu option. Choose a quality and the extension saves the video as MP4.


      ### Does this work with Pornhub Premium and Thumbzilla?


      Yes. The extension supports Pornhub, Pornhub Premium, and Thumbzilla. For Premium content, you must already be logged in with an active authorized session.


      ### What quality options are available?


      The extension reads mediaDefinitions, HTML5 sources, and HLS manifests to list available variants. Options are sorted highest to lowest quality with MP4 preferred when available.


      ### What format are downloads saved in?


      Downloads are saved as standard MP4 files. Direct MP4 sources save directly, while HLS streams are converted to MP4 in-browser.


      ### Where are files saved?


      Files are automatically written to a PornHub subfolder inside your browser's default Downloads directory.


      ### Does this support live streams or VR?


      No. This product does not support live-stream capture or VR-specific workflows.


      ### Can it bypass DRM, paywalls, or restricted account access?


      No. The extension only works with content your current session can already access and does not bypass DRM, paywalls, or account permissions.


      ### Why is the extension not finding my video?


      Press play first so the stream is exposed, then retry using the player button or popup. If needed, refresh the page and wait for the player to fully load.


      ### Which browsers are supported?


      Desktop builds support Chrome, Edge, Firefox, Brave, Opera, Whale, and Yandex on Windows, macOS, and Linux. Safari and mobile browsers are not supported.


      ### How does the free trial work?


      After secure OTP email verification, you get 3 free downloads per device. Unlimited use requires the paid subscription.


      ### Why does the extension need these permissions?


      Permissions such as downloads, activeTab, scripting, tabs, contextMenus, and offscreen are required to detect sources, inject controls, convert HLS to MP4, and save files while keeping progress in sync.


      ### Is my data private?


      Yes. Video detection and processing run locally in your browser. Media files are not uploaded to external servers.


      ### Is this legal?


      DISCLAIMER: We are not attorneys and do not offer legal advice. Laws vary by country and platform. For any legal question please consult a qualified legal professional.


