# serpcompany/best.serp.co#340: move 11 renamed listings out of Other to the category the audit
# gives them, as the owner decided in chat on 2026-10-10 (decision 3). listing-categories-set replaces
# each listing's [other] with that category as its primary. Renamed listings whose audit category is
# a proposed new one (d1/hygiene/2026-10-10-other-categories.yaml newCategories, which no manifest
# creates; the taxonomy work is #341) or that have none stay in Other, and so does faceapp.com.
# Generated by `pnpm catalog:mismatch` from the audit's decisions. Every operation expects the
# listing as the reviewed inventory lists it (d1/hygiene/2026-10-10-other-inventory.json, the v1
# import's values; no committed manifest changes them), filed under [other] alone. None is in the
# 2026-10-10-other-categories batches (#333), 2026-10-10-other-removals, or
# 2026-10-10-duplicate-listings (#332). Row-level: a listing that changed since, or is no longer as
# expected, refuses the whole batch, with nothing written. Publish after #333's batches and
# 2026-10-10-other-removals, staging first, then production after promotion; the three #340
# manifests apply in any order relative to each other.
