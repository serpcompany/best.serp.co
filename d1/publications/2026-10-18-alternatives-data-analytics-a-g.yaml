# serpcompany/best.serp.co#539 (batch D): hand-picked alternatives for the 37 live listings whose
# primary category is Data & Analytics and whose slug starts with a to g (avanty.app to grid.is),
# the first part of Data & Analytics in #539's size order; a later batch takes h to z. The picks
# lead each page's Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do and what their sites offer that day: a pick does the same job for the same
# kind of user, best first, and a listing gets fewer than six, or none, when nothing else fits.
# Every listing and pick is a v1 import listing, with the same id and slug on staging and
# production. The reason for each listing is the comment above its operation. Picks may come from
# any category: Stripe, Paddle, Orb and Genius Sheets are filed under Business & Finance,
# AIHelperBot (sqlai.ai), Caspio, Knack and Glide under Developer Tools, and DiagramGPT (eraser.io)
# and GPT Workspace under Productivity.
# Five listings have no operation, because nothing in the catalog substitutes for them: Byterat
# (byterat.io), Cradle AI (cradle.bio), Datasette ChatGPT plugin (datasette.io), Goodlookup
# (goodlookup.com), and Granica (granica.ai). Their pages keep the similar-listings fallback.
# Seven listings have no operation, because their sites no longer offer what the listing describes
# (pivoted, acquired, or unreachable), and batch D's pull request lists them for retirement:
# Cybertiks (cybertiks.com), Dolly by Databricks (databricks.com), Findly (findly.ai), Channel
# (fluenthq.com), ChatGPT in Google Sheets (gox.ai), Gretel (gretel.ai), and GRID 2.0 (grid.is).
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
