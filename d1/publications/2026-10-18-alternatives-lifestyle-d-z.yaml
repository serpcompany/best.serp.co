# serpcompany/best.serp.co#539 (batch G): hand-picked alternatives for the 110 live listings whose
# primary category is Health & Lifestyle and whose slug starts with d to z (dishgen.com to
# yougotcooking.com), the rest of Health & Lifestyle after batch F's a to c. The picks lead each
# page's Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. That day each listing's site and
# each pick's site was read to confirm it still offers the product its listing describes; nine were
# read in a browser (Dream Interpreter, DreamStory, Layla, Skoot, Gatherly, Noom, ixigo, FaceApp's
# hairstyle filters and Velo.ai's product page).
# Picks may come from any category: Consensus is filed under Education, FaceApp and Meshy under
# Image & Design, and Nabla and Suki under Productivity. Every listing and pick is a v1 import
# listing, with the same id and slug on staging and production. The reason for each listing is the
# comment above its operation.
# Forty-five listings have no operation. Thirty-eight because nothing in the catalog substitutes for
# them on 2026-10-18: DREAM.page (a community and events platform for curated communities), Pod AI
# by Eightsleep (a smart bed cover that cools and heats each side of the bed), ElfMessages
# (personalised audio messages from a Christmas elf), Endurance (structured group workouts for
# running, cycling and swimming teams), Flora incognita (identifying plants from a photo), Face
# Shape AI (detecting your face shape from a photo), Getactyv (AI-guided physiotherapy at home),
# HeardThat (a phone app that makes speech clearer in noisy places for people with hearing aids),
# Jeffrey Célavie (an AI astrologer chat), Rhubarb (smart backyard gardens with growing coaching),
# Josh.ai (AI voice control for the smart home), Keeper (matchmaking for people who want to marry,
# with human matchmakers), Lion Browser (safer browsing and parental-control apps for families),
# LitRPG Adventures (AI generators of tabletop RPG content), Medgic (checking skin problems from a
# photo), MeowTalk (translating cat meows), Mighty Travels (a membership that emails airfare and
# hotel deals and error fares), Moveme (movie picks by the mood you want), OnePanel (reading manga
# one panel at a time), Onoco AI (a parenting app that tracks and shares a baby's care and
# milestones), Ask Poppy (a baby registry), PMcardio (AI ECG interpretation for heart care), proudP
# (measuring urine flow and prostate symptoms at home), RPS AI (playing rock paper scissors against
# an AI), Safewaters (shark-risk and surf forecasts), Sens.ai (neurofeedback brain training at
# home), Siwalu (identifying animals and breeds from a photo), Soharhealth (insurance checks and
# patient intake for healthcare providers), AI Sports Prediction (AI football predictions for
# betting), StarByFace (finding which celebrity you look like), Stitch Fix (personal styling with
# clothes shipped to your door), Write A Thank You (writing thank-you notes), This Word Does Not
# Exist (inventing new English words with AI), TTcare (AI health checks for pets from photos),
# Unlearn (digital twins of patients for clinical trials), Unpromptedgame (a game of guessing the
# words behind AI images), Velo.ai (a bike radar camera that warns of cars from behind) and
# Video2Recipe (turning cooking videos into written recipes). Seven because their sites don't offer
# the listed product on 2026-10-18, so they are retirement candidates and no listing picks them: The
# Simulation (fablesimulation.com, a 2023 placeholder pointing to Showrunner), FashionAdvisorAI
# (fashionadvisorai.com, now a gambling site), JourneyPlan (journeyplan.co, answers 410 Gone),
# Kinetix (kinetix.tech, now a motion-AI research lab), Nutrition AI (nutrition.ai, only a "stay
# tuned" mailing list), Skoot (skoothere.com, redirects to ad links) and Woebot Health
# (woebothealth.com, the app was retired on 2025-06-30). Their pages keep the similar-listings
# fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
