# serpcompany/best.serp.co#539 (batch I): hand-picked alternatives for the 17 live listings whose
# primary category is Marketing & SEO and whose slug starts with a to b (b2metric.com to buzzli.in;
# none starts with a), the next category in #539's size order after Business & Finance. The picks
# lead each page's Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. That day each listing's site and
# each pick's site was read to confirm it still offers the product its listing describes; Publer,
# whose site answers scripts with a cookie page, was read through a page reader.
# Picks may come from any category: Twilio is filed under Developer Tools. Every listing and pick is
# a v1 import listing, with the same id and slug on staging and production. The reason for each
# listing is the comment above its operation.
# One listing has no operation, because nothing in the catalog substitutes for it on 2026-10-18:
# Business Rocket Solutions (websites and client portals built for home-service trades in Northern
# Virginia). Its page keeps the similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
