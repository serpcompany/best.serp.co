# serpcompany/best.serp.co#539 (batch 1 of many): hand-picked alternatives for the 50 live listings
# whose primary category is Cloud & Hosting, the smallest category, first in #539's order (categories
# by size). The picks lead each page's Alternatives section; the page tops it up to six from similar
# listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its candidates
# say they do: a pick does the same job for the same kind of user, best first, and a listing gets
# fewer than six, or none, when nothing else fits. Picks may come from any category: Amazon Polly
# (aws.amazon.com), NVIDIA Canvas (nvidia.com) and watsonx.ai (ibm.com) are filed here but are a
# text-to-speech service, a sketch-to-image tool and an AI platform, so they get their own kind. Every
# listing and pick is a v1 import listing, with the same id and slug on staging and production. The
# reason for each listing is the comment above its operation.
# Five listings have no operation, because nothing in the catalog substitutes for them: CyraCom
# (interpreting services), Linqto (private-company investing), LuxSci (HIPAA-compliant email),
# Sherweb (a cloud marketplace for MSPs), and TrueVault (privacy compliance software). Their pages keep
# the similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
