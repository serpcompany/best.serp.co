# serpcompany/best.serp.co#539 (batch C): hand-picked alternatives for the 32 live listings whose
# primary category is Education and whose slug starts with a to i (briskteaching.com to
# ipscreener.com), the first part of Education in #539's size order; a later batch takes j to z.
# The picks lead each page's Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. That day each listing's site and
# each pick's site was read to confirm it still offers the product its listing describes; four that
# block scripts were read from their latest readable Internet Archive snapshot (Gliglish,
# Quizgecko and Scite from September or October 2026, Interactive Mathematics from March 2026).
# Picks may come from any category: Wolfram|Alpha is filed under Chatbots & Agents, ChatMind and
# ConceptMap.ai under Productivity, SciSummary and Summarist under Writing, ClientZen under
# Marketing & SEO and Traq.ai under Business & Finance. Khanmigo has two listings (khanacademy.org,
# khanmigo.ai); picks name khanmigo.ai only. Duolingo Max's Video Call is AI conversation practice,
# so it is a pick for Call Annie and Gliglish. Two catalog listings are left out as picks: Polyglot
# AI (polyglotchatbot.com; its only app is gone) and Quiz Makito (quizmakito.com; a self-study quiz
# app last updated in 2023). Every listing and pick is a v1 import listing, with the same id and
# slug on staging and production. The reason for each listing is the comment above its operation.
# Eight listings have no operation. Four because nothing in the catalog substitutes for them: ES.AI
# (college application essays), Hello History (chats with historical figures), Credly (digital
# credentials) and IPscreener (patent research; the catalog's patent tools draft applications
# instead). Four because their sites don't offer the listed product today, so they are retirement
# candidates and no listing picks them: Codeamigo (its courses say "Coming Soon" behind a waitlist),
# Delv (now a waitlist for a message-writing tool), Eilla (now an M&A advisory service) and Emberly
# (now a bookmark and notes organizer). Their pages keep the similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
