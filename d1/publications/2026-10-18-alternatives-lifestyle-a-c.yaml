# serpcompany/best.serp.co#539 (batch F): hand-picked alternatives for the 17 live listings whose
# primary category is Health & Lifestyle and whose slug starts with a to c (bargpt.app to
# copilot2trip.com; none starts with a), the first part of Health & Lifestyle in #539's size order;
# a later batch takes d to z. The picks lead each page's Alternatives section; the page tops it up
# to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. That day each listing's site and
# each pick's site was read to confirm it still offers the product its listing describes; BarGPT,
# which blocks scripts, was read in a browser.
# Every listing and pick is a v1 import listing, with the same id and slug on staging and
# production. The reason for each listing is the comment above its operation.
# Six listings have no operation. Five because nothing in the catalog substitutes for them on
# 2026-10-18: BarGPT (AI cocktail recipes), Be My Eyes (live visual help for blind and low-vision
# people from volunteers and AI), Boredhumans (a collection of free AI toys and entertainment
# tools), CareFlick (an AI companion that keeps older people company) and ChessGPT.ai (playing chess
# against ChatGPT). One because its site doesn't offer the listed product on 2026-10-18, so it is a
# retirement candidate and no listing picks it: Cheerleaderai (cheerleaderai.com, the connection
# fails). Their pages keep the similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
