# serpcompany/best.serp.co#523 (part 1 of 2): logos for today's five listings (#506), whose pages
# showed the grey placeholder. Each image is in the upload plan
# d1/media/2026-10-17-serp-sites-fill-logos.json, sources checked on 2026-10-17
# (`pnpm media:upload:dry-run`: 5 of 5 verified):
# - Keybumps App and Zenbu Japanese: each site's own 180 px apple-touch-icon.
# - SERP Games: the site's own favicon, a 64 px PNG served as favicon.ico.
# - SERP Tools and SERP Lists: SERP's mark, from serp.co's 180 px apple-touch-icon (#520: "from
#   SERP's brand files"). SERP Tools' own favicon is the framework's default icon, and SERP Lists'
#   is the same SERP mark as a 410 KB multi-size ICO.
# PRODUCTION ONLY, like 2026-10-17-serp-sites-fill (#506); on staging every operation is refused,
# leaving the catalog unchanged. The plan still goes to the staging bucket first: Upload Listing
# Media (staging), then, after the promotion, Upload Listing Media, which copies staging's verified
# objects. The publisher refuses this manifest until production's bucket holds all five.
# Each listing-media-update expects no logo or image rows (listing-create wrote none) and refuses
# a listing with a queued upload it would drop. Row-level, so the batch is refused with nothing
# written if any of the five changed since.
# Publish on production after the production upload, in any order with
# 2026-10-17-serp-sites-fill and 2026-10-17-serp-sites-fill-details.
