# serpcompany/best.serp.co#539 (batch B): hand-picked alternatives for the 26 live listings whose
# primary category is Video and whose slug starts with a to f (avc.ai to flowjin.com), the first
# part of Video in #539's size order; a later batch takes g to z. The picks lead each page's
# Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. Picks may come from any category:
# HeyGen, Tavus and the product-photo tools are filed under Image & Design, Descript under Audio &
# Music. Flair AI (flair.ai) is filed here but makes product photos, so it gets product-photo picks.
# Runway has two listings (runway.ml, runwayml.com); picks name runwayml.com only. Every listing and
# pick is a v1 import listing, with the same id and slug on staging and production. The reason for
# each listing is the comment above its operation.
# Two listings have no operation, because nothing in the catalog substitutes for them: Colourlab (AI
# color grading for colorists) and FineCam (a phone as a webcam). Their pages keep the
# similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
