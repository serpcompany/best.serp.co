# serpcompany/best.serp.co#338, the follow-up #332 asked for: 2026-10-10-duplicate-listings.yaml
# unpublished 14 duplicate listings, so their URLs answer 410 Gone. This manifest sends each retired
# slug to the listing it duplicated instead: /products/<retired>/ answers 308 to
# /products/<kept>/, which keeps the retired URL's links and sends visitors to the product.
#
# Each operation is a listing-slug-redirect: one listing_slug_redirects row, (kept id, retired slug,
# kept slug). The product page looks the slug up there before it renders the gone page, and
# follows the kept id to that listing's current slug. The retired rows stay unpublished, so they stay
# out of the sitemap, search, RSS and category pages. Republish in /admin still brings one back:
# its live page then wins over the redirect.
#
# Kept and retired ids and slugs are 2026-10-10-duplicate-listings.yaml's (the v1 import's ids); its
# header and reasons say why each slug stays.
#
# Publish after 2026-10-10-duplicate-listings.yaml on the same environment: until then the retired
# listings are live and every operation refuses. Row-level: the batch refuses whole, with nothing
# written, if a retired listing isn't unpublished, a kept listing isn't live (or its id or slug
# changed), a retired slug already redirects, a kept slug is itself a redirected slug, or an older
# slug redirects to a retired listing. Apply staging first, then production after promotion.
version: 1
id: 2026-10-10-duplicate-listings-redirects
concurrency: rows
provenance:
  actor: devinschumacher
  workflow: github/publish-d1
