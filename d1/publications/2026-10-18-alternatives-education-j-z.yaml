# serpcompany/best.serp.co#539 (batch D): hand-picked alternatives for the live listings whose
# primary category is Education and whose slug starts with j to z (jungleai.com to youlearn.ai), the
# second part of Education in #539's size order after batch C's a to i. 62 of the range's 63
# listings are here: staging's Zenbu Japanese (zenbujapanese.com) is not a v1 import listing and has
# another id on production, where #542 picks for it. The picks lead each page's Alternatives
# section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do and what their sites offer that day: a pick does the same job for the same
# kind of user, best first, and a listing gets fewer than six, or none, when nothing else fits.
# Every listing and pick is a v1 import listing, with the same id and slug on staging and
# production. The reason for each listing is the comment above its operation. Picks may come from
# any category: the chat-with-documents tools Petal picks (ChatPDF, PDF.AI, Docalysis, Docanalyzer,
# Sharly AI) are filed under Productivity and Charley.ai under Writing. Khan Academy has two
# listings (khanacademy.org, khanmigo.ai); picks name khanmigo.ai only, and neither picks the other.
# Seven listings have no operation, because nothing in the catalog substitutes for them: KodeKloud
# (kodekloud.com), Lablab.ai (lablab.ai), Locus (locusextension.com), Moonbeam Exchange
# (moonbeamexchange.com), Course: Building No-Code Apps with AI (nocode.mba), SynthaceGPT
# (synthace.com), and Tarteel (tarteel.ai). Their pages keep the similar-listings fallback.
# Seven listings have no operation, because their sites no longer offer what the listing describes
# (pivoted, down, abandoned, or only a waitlist), and batch D's pull request lists them for
# retirement: AI Tutor (myapps.ai), Whiteboard (mywhiteboard.ai), Polyglot AI (polyglotchatbot.com),
# Prepsup (prepsup.com), ProfBot (profbot.ai), Talkberry - mock interview (talkberry.ai), and Typpo
# (typpo.app).
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
