# serpcompany/best.serp.co#539 (batch A): hand-picked alternatives for the 60 live listings whose
# primary category is Ecommerce, the next category in #539's order (categories by size). The picks
# lead each page's Alternatives section; the page tops it up to six from similar listings.
# Picked on 2026-10-18 from staging's live listings (read-only), each also live on production
# (https://best.serp.co/sitemap-products.xml, read that day), by what each listing and its
# candidates say they do: a pick does the same job for the same kind of user, best first, and a
# listing gets fewer than six, or none, when nothing else fits. Picks may come from any category:
# Square, Squarespace, Wix ADI and Weblium (website builders that sell online), Shogun (a Shopify
# storefront builder), and Ecomtent, CopyMonkey and TreeBrain (AI product-listing copy) are filed
# elsewhere. Klevu and Searchspring are now one company, Athos Commerce (both sites say so), so
# neither picks the other, and no listing picks both. Every listing and pick is a v1 import
# listing, with the same id and slug on staging and production. The reason for each listing is the
# comment above its operation.
# Eight listings have no operation, because nothing in the catalog substitutes for them: Broadn (B2B
# quote-to-cash), BuyLensAI (a shopping extension that saves and compares products), Dropy AI (AI
# dropshipping automation), Looria (shoppers' product research from independent reviews), PPSPY
# (Shopify product and store research), EcoReturns (saara.io, a returns platform), SmartScout
# (Amazon seller research) and SnapArt (AI product customization for Shopify). Their pages keep the
# similar-listings fallback.
# Each listing-alternatives-set compares and swaps the listing's slug and current picks (none yet),
# refuses a pick that isn't live with that id and slug, keeps the listing's checksum, and logs an
# `edited` event. Row-level, so the batch is refused with nothing written if any listing changed.
# Needs migration 0018_listing_alternatives (#534, release 9). Publish on staging first, then on
# production after the promotion that carries it.
