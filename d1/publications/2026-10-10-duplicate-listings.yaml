# serpcompany/best.serp.co#332, from #325's Ahrefs audit of staging: 14 products are listed twice,
# under two slugs with the same name, H1, and description, so each pair splits its links and
# competes with itself in search. Keep one listing per pair and unpublish the other: its page
# answers 410 Gone (the gone page links its category, which lists the kept listing) and leaves the
# sitemap, search, RSS, and category pages. The rows stay (Republish in /admin brings one back).
#
# 410, not a redirect: `listing_slug_redirects` sends an old slug to its own listing, and its only
# writer, `listing-slug-change`, renames a listing to a free slug and is not row-level. No manifest
# operation points one listing's slug at another listing, so this uses `listing-unpublish`.
#
# Kept slugs, checked 2026-10-10 with read-only GETs (each operation's `reason` says why):
# - SERP's downloaders keep `<name>-video-downloader`. Every serp.ly link of both listings ends on
#   apps.serp.co/<name>-video-downloader, and apps.serp.co/<name>-downloader is 404 or redirects
#   there.
# - Rebrands and acquisitions keep the current brand's domain: maestrolabs.com (Flowrite is now
#   MailMaestro, from Maestro Labs), jacquard.com (Phrasee is now Jacquard), lambda.ai, timely.com,
#   timeos.ai (magical.so now serves timeOS with its canonical at timeos.ai, and timeOS is now
#   Timeless: timeos.ai redirects to timeless.day), and scaleserp.com (the product is still Scale
#   SERP; trajectdata.com is its parent company's site).
#
# Media first, in the same batch: eight kept listings lack media their duplicate has, so each gets
# a copy of it under its own key: the logo of six downloaders (Facebook, Kajabi, Loom, SproutVideo,
# Vimeo, Whop), Lambda's social image, and Scale SERP's logo and image. Each update lists the
# listing's current rows and refuses the batch if they changed. Skool's and Wistia's kept listings
# already have the same logo, and the other kept listings have as much media as their duplicate
# (neither timeOS listing has a logo or image).
# Upload d1/media/2026-10-10-duplicate-listings.json to the environment first: the publisher
# refuses keys its bucket does not hold.
#
# Owners, claims, badges: no page of the 28 showed a Verified owner badge on staging or production.
# Each unpublish is `unowned`: a listing anyone owns, claims, paid for, or submitted by publish time
# refuses the whole batch, rather than leaving those records on a retired row. Claim holds
# (2026-10-06-listing-claim-holds) stay on their rows.
#
# Ids are the v1 import's (.archive/d1/artifacts/); categories and websites match each listing's
# public page on staging and production. Row-level: a listing whose id, slug, website, categories,
# or media changed, that is no longer live, or whose own submission is in review refuses the whole
# batch, with nothing written. Apply staging first, then production after promotion.
