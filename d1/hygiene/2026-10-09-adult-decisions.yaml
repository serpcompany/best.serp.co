# serpcompany/best.serp.co#260: best.serp.co lists no adult products (owner decision of 2026-10-09). Every
# listing in the Adult category and every listing built for an adult site goes, and the Adult category retires.
# d1/publications/2026-10-09-adult-category.yaml and 2026-10-09-adult-removal.yaml
# (`pnpm catalog:domains -- adult-manifest`) unpublish each entry and retire the category, so their URLs
# and /products/categories/adult/ answer 404.
#   adult-category:  filed under Adult in the import. All are downloaders for adult video, cam, or fan
#                    sites, read by hand; none is a general-purpose tool.
#   filed-elsewhere: built for an adult site but filed under another category in the import. #98 added Adult
#                    to 14 of them as a secondary category; the adult-category manifest adds it to the rest.
# kept: keyword matches read by hand that stay listed. General-purpose downloaders (YouTube, Vimeo, and the
# like) stay. Counted against the reviewed catalog (see evidence); the manifests' guards refuse any listing
# an environment changed since.
