# serpcompany/best.serp.co#349 (step 7 of #341): how today's 138 categories and #333's clusters map onto the
# three layers. 16 broad hub categories, 125 tags and 30 /best/<keyword>/ pages, with a permanent redirect for
# every old category URL. `pnpm catalog:taxonomy` (scripts/taxonomy-manifest.ts) turns it into the row-level
# manifests d1/publications/2026-10-10-taxonomy-*.yaml. The design is #341's "Design (1/3)" to "(3/3)".
#
# decidedAt: the owner's hands-off decision of 2026-10-10 ("as hands off as possible", on #321). Every choice
# below is design section 7's default, recorded here instead of asked:
#   Q1, Q2, Q17  the 16 hubs of design 1.6 with short topic slugs; video-downloaders stays as the existing hub.
#   Q3, Q4       tags at /products/tags/<tag>/; hubs keep /products/categories/<hub>/ (routes: #346).
#   Q5, Q6       hybrid best pages: the 30 of design 5.2, each with its top 10 pinned by the rule below.
#   Q7           list size 10; the index thresholds (tags 10, best pages 5, hub chips 3) live in the code (#346).
#   Q8, Q10      #333's 24 clusters become tags, not categories; 36 categories merge into a neighbouring tag
#                (design 2.2's table, unchanged).
#   Q9           Other stays a catch-all for the listings nothing fits; step 10 (#351) retires it.
#   Q14          titles and H1s "Best {keyword, plural, title case}", with no year; intros drafted here.
#   Q15          the owner dispatches the manifests one at a time, in file order (the PR lists them).
# Defaults this file adds where section 7 is silent:
#   - Keywords keep design 5.2's phrasing. Every one marked "pending" there was checked with Ahrefs Keywords
#     Explorer (US) at keywordsCheckedAt, and the 8 #333 checked were checked again; `volume` is the US monthly
#     volume. A variant with more volume was not swapped in: design 5.1 picks singular or plural by volume, and
#     5.2's phrasing already does. Variants seen: ai song generator 72,000 (ai music generator 49,000);
#     ai coding 5,600 (ai coding assistant 1,800); ai for data analysis 2,800 (ai data analysis 1,300);
#     social media ai 1,500 (ai social media tools 300).
#   - A tag that keeps an old category's slug keeps its name and description. New hubs and cluster tags get
#     the template every category already uses ("Browse <name> listings and resources."). Writing new
#     category copy is not this step's.
#   - Order: hubs 1 to 16 as listed (video-downloaders keeps its own); tags and best pages 0 (name order).
#   - Intros: 60 to 150 words, written from the descriptions of the pool's listings. They describe the kinds
#     of tools on the page and make no claim D1 can't support: no ratings, rankings or prices.
#
# Who moves (phase 2). The input is the reviewed catalog: d1/hygiene/2026-10-10-other-inventory.json (the
# 2,419 listings filed only under Other) and 2026-10-10-taxonomy-inventory.json (every other approved listing,
# live or unpublished), with the 16 committed manifests published after that snapshot applied on top, named in
# the generator (`taxonomyInputManifests`): #337 and #352 (#332, #338), other-removals and the 9
# other-categories batches (#333), and #358's 4 (#340). A manifest committed later is never read.
#   - Every approved listing filed under a retiring category, live or unpublished, is filed under its hub
#     alone, and tagged with each of its categories' tags (merges applied, duplicates dropped), in membership
#     order. Its hub is its primary category's tag's hub, or video-downloaders.
#   - A live listing filed only under Other with a #333 cluster (`newCategory`, or #340's `category` for a
#     listing the owner renamed or fixed) moves to the cluster tag's hub, tagged with the cluster first and
#     then its #333 secondary hints.
#   - Left out: listings filed under a retired category (Adult: they stay 404); every listing #337, #358 or
#     other-removals unpublishes; and the clustered Other listings `held` below, whose owner flag stands.
#     Two of #337's retired duplicates, lambdalabs.com and timelyapp.com, are filed under retiring categories
#     and are slug redirect sources (#352), so category-unpublish would refuse while they stay: they are
#     re-filed under their hub, with no tags.
#   - The 141 live listings left filed only under Other stay there, untagged.
# hubs[].listings, other.listings and tags[].listings count live listings once every phase is published
# (primary category, and tag). The generator refuses the mapping when its plan differs from them.
#
# bestPages: keyword and volume (Ahrefs, US), its pool (a tag, or the video-downloaders hub), the intro, then:
#   pins       the top 10 of the pool by Ahrefs organic traffic (Batch Analysis, 2026-10-10: all countries,
#              the listing's host and its subdomains), in that order. evidence is what ranked each pin.
#              Skipped: excluded listings; listings with an active claim hold (2026-10-06-listing-claim-holds,
#              less #358's five clears), whose link ends off the product; the listings #333 flagged for
#              uncensored or NSFW plans (freedomgpt.com, opendream.ai, openjourneybot.com); every listing in
#              featureListings, on every page; and the page's passedOver.
#              video-downloader's listings are SERP's own products with no domain of their own: it pins the
#              video downloaders whose "<platform> video downloader" has the most US searches (Ahrefs,
#              2026-10-10), never a fan-site or adult-site downloader. hipaa-compliant-hosting pins only a
#              provider whose own site offers HIPAA hosting (its evidence names the page, GET 2026-10-11) and
#              excludes the rest. No pin has a blurb: each shows its listing's description.
#   passedOver a listing that would rank above the 10th pin but isn't the keyword's kind of product, whose
#              listing copy describes something else, or that duplicates a pin.
#   exclude    pool listings the page never shows (design 5.2: student study tools on
#              ai-tools-for-teachers, data-extraction tools on ai-pdf; and hosts with no HIPAA offering on
#              hipaa-compliant-hosting).
# featureListings: a listing that names one feature, add-on, model or sub-tool of a larger site (Einstein GPT
#   on salesforce.com, ChatSpot on hubspot.com, Slack GPT, Miro AI) is never ranked by its host's traffic,
#   which measures the parent product: it is passed over on every page. A listing that is the site's own
#   product (Picsart, Cursor, Monday.com, a renamed product such as Mapify's ChatMind) counts.
# redirects: design 2.2's table, unchanged: every narrow category's URL to its tag, or to the best page that
#   takes over its tag; then every tag a tag-only best page uses, to that page. None aims at a retiring
#   category, and none at a URL that redirects itself.
