    or replace backgrounds, upscale low-resolution images, erase objects and watermarks, retouch portraits,
    swap faces, and restore or colorize old photos. Some run in the browser, some are mobile apps, and
    some offer an API for batch work such as product photos for online stores. Several focus on a single
    task, like background removal, while others bundle many tools into one editor. Each entry links to
    its own listing with a description and the product's website.
