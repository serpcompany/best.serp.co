# serpcompany/best.serp.co#351 (step 10 of #341): where every approved listing still filed under Other goes, so
# that Other retires with a permanent redirect to /products/. `pnpm catalog:other-retirement`
# (scripts/other-retirement.ts) turns it into the row-level manifests d1/publications/2026-10-11-other-retirement-*.yaml.
# The design is #341's "Design (1/3)" to "(3/3)", sections 1.5 and 6 step 10.
#
# Input: d1/hygiene/2026-10-11-other-residue-inventory.json, the 726 approved listings the committed manifests leave
# filed under Other alone (141 live, 585 unpublished): the taxonomy generator's reviewed catalog, then #349's 25
# taxonomy manifests and #376's downloader links, replayed. Staging D1 matched it read-only on 2026-10-11 (ids, live
# states, names, websites, descriptions); production reaches it with its own publish of the same list.
#
# decidedAt: the owner's hands-off rule (#321: decide with defaults, record them, carry on). Every call below applies
# an owner decision already made for the same kind of listing; the PR lists them for review.
#
# listings: each of the 141 live listings, with what its website showed on checkedAt (the inventory's `check`: the
#   listing domain check's fetcher and classifier, read-only GETs, plus a browser-like curl of the pages it couldn't
#   read or that changed) and its copy. Each either moves or retires:
#   - Moves (hub, tags): filed under its hub alone; its tags are existing tags it squarely fits, else none. Hubs
#     follow #349's: the hub a tag of its kind sits under, or the hub of its kind of product (dream, astrology, pet,
#     plant, dating and game apps under lifestyle; name generators under business; website monitors, WordPress
#     plugins and development firms under developer-tools, the firms tagged ai-development-services as #333's
#     cluster tags revsys.com and osher.com.au). No new tag: the residue's clusters are 2 to 5 listings, which #333
#     folded as too few for a category (its alignments), and a tag below 10 listings is noindex anyway (docs/urls.md).
#   - retire: unpublished by -01-removals (410, Republish in /admin brings it back), then re-filed under its hub
#     without tags, as #349 re-files retired listings, so its 410 stays a 410 when Other retires:
#       dead, hijacked, not-a-product  #340's decision 1 (owner, 2026-10-10) for its retire-dead, retire-hijacked and
#                                      retire-not-a-product verdicts: a hygiene removal, not `unowned`. Articles,
#                                      press releases, research pages, demos, art projects, publications, a gone or
#                                      parked site, a domain that serves something else.
#       spam                           the owner's #333 decision of 2026-10-10 (2026-10-10-other-removals unpublished
#                                      the traffic bots sparktraffic.com and trafficbotpro.com): the four CTR and
#                                      traffic bots #333 left waiting. A hygiene removal, not `unowned`.
#       wrong-copy                     #340's decision 2: a real, live product whose copy describes something else is
#                                      retired instead of rewritten, `unowned` (a listing someone owns, claims or paid
#                                      for refuses the batch). Includes #340's two held listings that came back.
#       duplicate                      #332's rule: one listing per product stays; the other is unpublished `unowned`
#                                      and its slug redirects to the kept one (-03-retire, #338). #333 held notion.com
#                                      and plusdocs.com for the owner to pick; the default keeps the listing #333
#                                      already categorized and #349 tagged (notion.ai, plusai.com), so nothing live
#                                      moves.
#   Kept although #333 or #349 flagged them, as the owner decided on 2026-10-12 (#404): hardware (eightsleep.com),
#   academic-integrity flags (collegetools.io, gptinf.com, studycrumb.com), betting predictions (sportsprediction.ai),
#   a collection of AI entertainment tools whose copy mentions virtual girlfriends (boredhumans.com, not built for adult
#   content under the owner's 2026-10-09 #260 decision), and graydient.ai (Pirate Diffusion), which permits NSFW image
#   generation once activated. The same decision keeps notion.ai and plusai.com over their duplicates. A listing is
#   filed by what its link lands on when that is the product (studycrumb.com, flyingdog.de). Retirements never feature
#   in a sample.
# unpublished: each of the 585 unpublished listings filed under Other but one, re-filed under a hub with no tags
#   (design 1.5: unpublished approved listings are re-filed, so their 410 doesn't become a 404 and Republish keeps
#   working). basis is where the hub comes from: #340's audit category, then #333's cluster or held category, mapped
#   to its tag's hub, else the listing's name and description (the inventory has both).
# leftInOther: imgnai.com, the adult listing. It stays filed under Other and answers 404 once Other retires, as
#   #260's adult listings filed under Adult do (docs/catalog-hygiene.md): adult search traffic isn't sent elsewhere,
#   and nothing can relist it.
# hubs, tags: live listings per hub once every phase is published, and per tag this mapping adds to. The generator
#   refuses the mapping when its plan differs from them.
