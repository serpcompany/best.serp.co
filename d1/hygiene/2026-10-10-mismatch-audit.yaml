# serpcompany/best.serp.co#340: the 139 listings #333 flagged as mismatch (copy that doesn't describe the product),
# each checked against its website and its staging page on 2026-10-10. The verdicts proposed; the owner decided in
# chat on 2026-10-10 (each entry's decision), and `pnpm catalog:mismatch` turns the decisions into manifests.
#   Input: the mismatch section of d1/hygiene/2026-10-10-other-owner-flags.yaml on issue-333-categorize-other
#   (b4aa120), in its order, with names and copy from 2026-10-10-other-inventory.json. Categories come from
#   2026-10-10-categories.json (existing) or 2026-10-10-other-categories.yaml newCategories (proposed).
#   Website: curl (OpenSSL build, desktop Chrome User-Agent, 20 s timeout, at most 4 requests at a time) on the
#   listing's website. serp.ly links answer 200 with a meta refresh, which was followed to the product. A request
#   with no reply was retried once. A TLS failure was also tried over http. Redirects were traced hop by hop.
#   Pages curl couldn't read (a Vercel or Cloudflare bot check, a JavaScript shell) were also opened in a desktop
#   browser; where only the browser got through, status says so. Read-only page loads throughout.
#   Staging: https://staging.best.serp.co/products/<slug>/ for all 139. Each answered 200, is filed under Other,
#   and shows the description and copy in the inventory, so "staging copy" in evidence is what the page shows.
#   Duplicates: no final host matched another listing's slug in staging's product sitemap (2,690 listings), and
#   no new name matched another inventory listing, so no listing is a duplicate.
# verdict:
#   keep-recategorize: real, live, named correctly, and the copy needs at most a one-line fix; category given.
#   keep-rewrite: real, live and named correctly, but the copy must be regenerated first; category given.
#   rename: the website or the slug's own domain now hosts a renamed or successor product, named in renameTo
#     (where the staging copy already describes that product, evidence says so); category given where one fits.
#   retire-dead: down, parked, for sale, shut down, a placeholder, or waitlist only, or the link redirects to an
#     unrelated page.
#   retire-hijacked: the domain now serves gambling, spam or an unrelated business.
#   retire-not-a-product: an article, blog, publisher, demo or research project.
#   duplicate: the same product as another listing (none found).
# finalUrl and status: where the website ended. status is the HTTP status, or dns-error, tls-error, cert-error or
# timeout when nothing answered; long tracking query strings are cut.
# decision (the owner, in chat on 2026-10-10):
#   retire (decision 1): every retire-dead, retire-hijacked and retire-not-a-product verdict except the three held.
#     d1/publications/2026-10-10-mismatch-removals.yaml unpublishes it, not `unowned`: a hygiene removal comes down
#     even if someone owns or claimed the listing.
#   hold (decision 1's exception): retire-dead, but the site may come back (held says why); recheck it first.
#   retire-instead-of-rewrite (decision 2): every keep-rewrite verdict. The same manifest unpublishes it with
#     `unowned`: a real product that someone owns, claims or paid for refuses the batch instead.
#   rename (decision 3): d1/publications/2026-10-10-mismatch-renames.yaml sets details: the new name, a short
#     factual description written from the live site on 2026-10-10, and a website only where the listing's link no
#     longer reaches the product (the page its serp.ly link points to is gone, 404, blocked or fails TLS): the
#     product's own URL. Where category is a live category, d1/publications/2026-10-10-mismatch-categories.yaml
#     moves the listing there out of Other; a proposed new category (ai-sales-tools, ai-survey-tools) waits for the
#     taxonomy work (#341), and the listing stays in Other. The long description stays: each of these already
#     describes the new product.
#   fix-description (decision 4): faceapp.com, whose one-line description was about Google Maps imaging; the renames
#     manifest sets details.description. Its ai-photo-editors is a proposed category too, so it stays in Other.
#   retire-instead-of-rename (decision 5): a rename whose long description still describes another product (an
#     explainer, an article, terms or policies). The removals manifest unpublishes it with `unowned`, as decision 2.
